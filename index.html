/* ---------- run & round ---------- */
function startRun(level,mode){
  mode=mode||P.mode;
  if(mode==="chars"||mode==="places"){startCharRun(level,mode);return;}
  var pool=shuffle(VERSES.filter(function(v){return v.level===level;})).slice(0,ROUNDS);
  S.run={mode:"verses",level:level,pool:pool,idx:0,gems:GEMS,score:0,correct:0,streak:0,missed:[],res:[],ended:false};
  startRound();
}
function startRound(){
  if(S.run.mode!=="verses"){startCharRound();return;}
  var run=S.run,v=run.pool[run.idx],pv=parseVerse(v);
  var masked=pv.toks.filter(function(t){return !t.plain;}).length-pv.clue.length;
  S.round={v:v,pv:pv,step:0,ans:[null,null,null],pts:[0,0,0],tapped:0,masked:Math.max(1,masked),
           opts:buildOpts(v,0,run.level),locked:false,done:false,ok:false,bonus:0,half:false,slipped:false};
  playShell();
}
function dotsHTML(){
  var run=S.run,h="";
  for(var i=0;i<run.pool.length;i++){
    var c=i<run.res.length?(run.res[i]?"ok":"no"):(i===run.idx?"cur":"");
    h+='<i class="'+c+'"></i>';
  }
  return h;
}
function gemsHTML(){
  var h="";
  for(var i=0;i<GEMS;i++)h+=gem("#5b9bff",32,i<S.run.gems?"":"lost");
  return h;
}
function slabHTML(){
  var R=S.round,h="";
  R.pv.toks.forEach(function(t,i){
    if(t.plain){h+=esc(t.pre+t.core+t.post)+" ";return;}
    var isClue=R.pv.clue.indexOf(i)>=0;
    h+='<span class="word">'+(t.pre?'<span class="p pre">'+esc(t.pre)+'</span>':'')+'<button class="tile'+(isClue?" clue open":"")+'" data-i="'+i+'" '+
       (isClue?'tabindex="-1" aria-label="'+esc(t.core)+'"':'aria-label="Hidden word, '+t.core.length+' letters. Tap to reveal."')+'>'+esc(t.core)+'</button>'+
       (t.post?'<span class="p post">'+esc(t.post)+'</span>':'')+'</span> ';
  });
  return h;
}
function playShell(){
  S.screen="play";
  var run=S.run,L=LV[run.level-1];
  app.innerHTML=
   '<div class="hud"><button class="icon-btn" id="leave" aria-label="Leave this run">'+ICON.x+'</button>'+
   '<div class="hud-mid"><div class="lvname">'+L.name+'</div><div class="vnum">Verse '+(run.idx+1)+' of '+run.pool.length+'</div><div class="dots" id="dots">'+dotsHTML()+'</div></div>'+
   '<div class="score" id="score">'+fmt(run.score)+'</div></div>'+
   '<div class="gems" id="gems" aria-label="'+run.gems+' gems left">'+gemsHTML()+'</div>'+
   '<div class="slab" id="slab">'+slabHTML()+'</div>'+
   '<div class="meter"><span id="polished"></span><div class="bar"><i id="barfill"></i></div></div>'+
   '<div id="panel"></div>';
  $("#leave").onclick=leaveRun;
  $("#slab").onclick=function(e){
    var t=e.target.closest?e.target.closest(".tile"):null;
    if(t)revealTile(t,true);
  };
  updateMeter();panel();
  window.scrollTo(0,0);
}
function leaveRun(){
  var m=modal('<h2>Leave this run?</h2><p style="margin-bottom:16px;color:var(--mute)">Your score for this run will be lost. Gems you have already earned are kept.</p>'+
    '<div class="btns"><button class="primary" id="stay">Keep playing</button><button class="secondary" id="go">Leave</button></div>');
  $("#stay",m).onclick=function(){closeModal(m);};
  $("#go",m).onclick=function(){closeModal(m);home();};
}
function worth(){
  var R=S.round,base=[80,100,120][R.step],f=1-0.75*(R.tapped/R.masked);
  if(R.half)f*=0.5;
  return Math.max(20,Math.round(base*f/5)*5);
}
function updateMeter(){
  var R=S.round,pol=$("#polished"),bar=$("#barfill");
  if(!R||S.screen!=="play"||!pol||!bar)return;
  var total=R.pv.toks.filter(function(t){return !t.plain;}).length;
  var open=$$(".tile.open").length;
  pol.textContent=R.done?"Polished: all "+total+" words":"Polished "+open+" of "+total+" words. Tap a stone to reveal it.";
  bar.style.width=Math.round(open/total*100)+"%";
  var w=$("#worthnow");if(w)w.textContent="+"+worth();
}
function revealTile(t,byPlayer){
  var R=S.round;
  if(!R||t.classList.contains("open"))return;
  if(R.done&&byPlayer)return;
  t.classList.add("open","fresh");
  t.removeAttribute("aria-label");
  if(byPlayer){R.tapped++;sfx.tick();}
  updateMeter();
}
function revealAll(){
  var tiles=$$(".tile:not(.open)");
  tiles.forEach(function(t,i){setTimeout(function(){
    if(!document.body.contains(t))return;
    t.classList.add("open","fresh");updateMeter();},reduced()?0:i*28);});
}
function panel(){
  var R=S.round,el=$("#panel");
  if(R.clue){charPanel();return;}
  if(R.done){doneCard(el);return;}
  var v=R.v,names=["Which book?","Which chapter?","Which verse?"];
  var seg=function(i,label,ph){
    var cls=R.ans[i]!==null?"done":(R.step===i?"cur":"");
    return '<div class="seg '+cls+'"><small>'+label+'</small><b>'+(R.ans[i]!==null?esc(i===0?refName(R.ans[i]):R.ans[i]):ph)+'</b></div>';
  };
  var h='<div class="ref">'+seg(0,"Book","?")+seg(1,"Chapter","?")+seg(2,"Verse","?")+'</div>'+
        '<div class="q"><span>'+names[R.step]+'</span><span class="worth" aria-label="Points available">'+gem("#ffbf47",20)+'<span id="worthnow">+'+worth()+'</span></span></div>'+
        '<div class="opts">';
  R.opts.forEach(function(o,i){
    h+='<button class="opt'+(R.step>0?" num":"")+'" data-i="'+i+'">'+esc(o.label)+'</button>';
  });
  h+='</div>';
  el.innerHTML=h;
  $$(".opt",el).forEach(function(b){b.onclick=function(){answer(+b.dataset.i,b);};});
}
function answer(i,btn){
  var R=S.round,run=S.run;
  if(R.locked||R.done)return;
  R.locked=true;
  var o=R.opts[i],btns=$$(".opt");
  if(o.ok){
    var w=worth();R.pts[R.step]=w;R.ans[R.step]=o.label;run.score+=w;
    btn.classList.add("ok");btns.forEach(function(b){if(b!==btn)b.classList.add("dim");});
    sfx.good();burst(btn,"#2ed39a",12);floatText(btn,"+"+w);updateScore();
    setTimeout(function(){
      if(R.step<2){R.step++;R.opts=buildOpts(R.v,R.step,run.level);R.locked=false;panel();}
      else finishRound(true);
    },700);
  }else{
    btn.classList.add("no");
    btns.forEach(function(b){if(R.opts[+b.dataset.i].ok)b.classList.add("ok");else if(b!==btn)b.classList.add("dim");});
    sfx.bad();vib(120);
    var firstSlip=!R.slipped;
    R.slipped=true;
    if(firstSlip)loseGem();
    if(R.step<2&&run.gems>0){
      /* wrong book or chapter: the gem is gone (once per verse), but she can still go on to the verse for half points */
      R.half=true;
      var right=R.opts.filter(function(x){return x.ok;})[0].label,at=R.step;
      setTimeout(function(){
        R.ans[at]=right;R.step=at+1;R.opts=buildOpts(R.v,R.step,run.level);R.locked=false;panel();
      },1100);
    }else{
      setTimeout(function(){finishRound(false);},1100);
    }
  }
}
function loseGem(){
  var run=S.run;run.gems--;
  var g=$$("#gems .gem")[run.gems];if(g)g.classList.add("lost");
  $("#gems").setAttribute("aria-label",run.gems+" gems left");
}
function updateScore(){
  var s=$("#score");s.textContent=fmt(S.run.score);s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop");
}
function finishRound(ok){
  var R=S.round,run=S.run;
  R.done=true;R.ok=ok;R.locked=false;
  if(ok){
    run.correct++;run.streak++;P.totalCorrect++;
    if(run.streak>P.bestStreak)P.bestStreak=run.streak;
    R.bonus=run.streak>=2?Math.min(run.streak,6)*20:0;run.score+=R.bonus;
    sfx.win();burst($("#slab"),"#ffbf47",18);
    if(R.clue){
      P.tokAcc+=(R.pts||0)+(R.bonus||0);
      var got=false;
      while(P.tokAcc>=TOKPTS){P.tokAcc-=TOKPTS;if(P.tokens<TOKMAX){P.tokens++;got=true;}}
      if(P.tokens>=TOKMAX)P.tokAcc=0;
      if(got)toast({token:1,color:"#ffbf47",name:"Bonus token earned",desc:"Use it to remove a wrong option. You have "+P.tokens+"."});
    }
  }else{
    run.streak=0;run.missed.push(R.clue?R.c:R.v);
  }
  run.res.push(ok);
  touchDay();
  var fresh=checkBadges();
  save();
  $("#dots").innerHTML=dotsHTML();
  updateScore();revealAll();
  if(R.clue){R.shown=5;$("#clues").innerHTML=cluesHTML(false);}
  setTimeout(function(){updateMeter();},ok?0:200);
  panel();
  $("#panel").scrollIntoView({behavior:reduced()?"auto":"smooth",block:"nearest"});
  fresh.forEach(function(b){toast(b);});
}
function doneCard(el){
  var R=S.round,run=S.run,last=run.idx>=run.pool.length-1||run.gems<=0;
  var pts=R.pts[0]+R.pts[1]+R.pts[2];
  var h='<div class="done-card '+(R.ok?"ok":"bad")+'">'+
    '<p class="msg">'+(R.ok?(R.tapped===0?"Found it without polishing a single stone.":"You found it."):"This one is")+'</p>'+
    '<div class="big">'+esc(refOf(R.v))+'</div>';
  if(R.ok){
    h+='<div class="rows"><div><span>Book, chapter and verse</span><b>+'+pts+'</b></div>'+
       (R.bonus?'<div><span>Streak of '+run.streak+' in a row</span><b>+'+R.bonus+'</b></div>':'')+'</div>';
  }else{
    h+='<p class="msg" style="margin-bottom:14px">'+(run.gems<=0?"You are out of gems. Your verses are listed on the next screen so you can read them again.":"Read it again above, then carry on. You have "+run.gems+(run.gems===1?" gem":" gems")+" left.")+'</p>';
  }
  h+='<button class="primary" id="next">'+(last?"See results":"Next verse")+'</button></div>';
  el.innerHTML=h;
  $("#next").onclick=nextRound;
}
function nextRound(){
  var run=S.run;
  run.idx++;
  if(run.gems<=0||run.idx>=run.pool.length)endRun();else startRound();
}

/* ---------- characters ---------- */
var CW=[100,80,60,40,20];
function startCharRun(level,mode){
  var pool=shuffle(POOL(mode).filter(function(c){return c.level===level;})).slice(0,ROUNDS);
  S.run={mode:mode,level:level,pool:pool,idx:0,gems:GEMS,score:0,correct:0,streak:0,missed:[],res:[],ended:false};
  startCharRound();
}
var FEMALE={sarah:1,ruth:1,esther:1,mary:1,naomi:1,hannah:1,abigail:1,martha:1,peninnah:1,jezebel:1};
var PLACECAT={"sinai":"mt","ararat":"mt","carmel":"mt","olives":"mt","hermon":"mt","tabor":"mt","gilboa":"mt","jordan":"water","redsea":"water","galilee":"water","eden":"site","gethsemane":"site","golgotha":"site","patmos":"island","egypt":"land","gilead":"land","moab":"land"};
var PLACEXTRA={"en":{"mt":["Mount Moriah","Mount Nebo","Mount Zion","Mount Gerizim","Mount Ebal","Mount Hor","Mount Seir"],"water":["Nile River","Euphrates River","Tigris River","Kishon River","Arnon River","Jabbok River","Dead Sea"],"site":["Pool of Siloam","Pool of Bethzatha","Valley of Hinnom","Kidron Valley"],"island":["Cyprus","Crete","Malta","Rhodes"],"land":["Canaan","Judah","Edom","Midian","Assyria","Persia","Macedonia","Galatia","Phoenicia"],"city":["Sodom","Gomorrah","Lachish","Hazor","Gath","Ashdod","Gaza","Sidon","Smyrna","Pergamum","Laodicea","Colossae","Derbe","Iconium","Berea","Troas","Miletus","Salamis","Paphos","Bethphage"]},"af":{"mt":["Berg Moria","Berg Nebo","Berg Sion","Berg Gerisim","Berg Ebal","Berg Hor","Berg Seïr"],"water":["Nylrivier","Eufraatrivier","Tigrisrivier","Kisonrivier","Arnonrivier","Jabbokrivier","Soutsee"],"site":["Bad Siloam","Bad Betsata","Hinnomvallei","Kidronvallei"],"island":["Siprus","Kreta","Malta","Rodos"],"land":["Kanaän","Juda","Edom","Midian","Assirië","Persië","Masedonië","Galasië","Fenisië"],"city":["Sodom","Gomorra","Lagis","Hasor","Gat","Asdod","Gasa","Sidon","Smirna","Pergamum","Laodisea","Kolosse","Derbe","Ikonium","Berea","Troas","Milete","Salamis","Pafos","Betfage"]}}; /* extra names used only as wrong options */
function charOpts(c,level,mode){
  var all=POOL(mode),others,extras=[];
  if(mode==="chars"){var f=!!FEMALE[c.id];all=all.filter(function(x){return !!FEMALE[x.id]===f;});}
  if(mode==="places"){
    var ct=PLACECAT[c.id]||"city";
    all=all.filter(function(x){return (PLACECAT[x.id]||"city")===ct;});
    extras=((PLACEXTRA[P.lang==="af"?"af":"en"]||{})[ct]||[]).map(function(n,i){return {id:"x"+ct+i,level:0,name:n};});
  }
  others=pick(all.filter(function(x){return x.level===level&&x.id!==c.id;}),3);
  if(others.length<3){
    others=others.concat(pick(all.filter(function(x){return x.id!==c.id&&others.indexOf(x)<0;}).concat(extras),3-others.length));
  }
  return shuffle([c].concat(others)).map(function(x){return {label:x.name,ok:x.id===c.id};});
}
function startCharRound(){
  var run=S.run,c=run.pool[run.idx];
  S.round={mode:run.mode,clue:true,c:c,shown:1,used:1,opts:charOpts(c,run.level,run.mode),locked:false,done:false,ok:false,bonus:0,pts:0};
  charShell();
}
function charWorth(){return CW[S.round.shown-1];}
function cluesHTML(fresh){
  var R=S.round,h="";
  for(var i=0;i<5;i++){
    if(i<R.shown)h+='<div class="clue'+(fresh&&i===R.shown-1?" new":"")+'"><span class="cn">'+(i+1)+'</span><p>'+esc(R.c.clues[i])+'</p></div>';
    else h+='<div class="clue lock"><span class="cn">'+(i+1)+'</span><p>Clue '+(i+1)+'</p></div>';
  }
  return h;
}
function charShell(){
  S.screen="play";
  var run=S.run,L=LVS(run.mode)[run.level-1];
  app.innerHTML=
   '<div class="hud"><button class="icon-btn" id="leave" aria-label="Leave this run">'+ICON.x+'</button>'+
   '<div class="hud-mid"><div class="lvname">'+L.name+'</div><div class="vnum">'+modeName(run.mode).one+' '+(run.idx+1)+' of '+run.pool.length+'</div><div class="dots" id="dots">'+dotsHTML()+'</div></div>'+
   '<div class="score" id="score">'+fmt(run.score)+'</div></div>'+
   '<div class="gems" id="gems" aria-label="'+run.gems+' gems left">'+gemsHTML()+'</div>'+
   '<div class="clues" id="clues">'+cluesHTML(false)+'</div>'+
   '<div id="panel"></div>';
  $("#leave").onclick=leaveRun;
  panel();
  window.scrollTo(0,0);
}
function charPanel(){
  var R=S.round,el=$("#panel");
  if(R.done){charDone(el);return;}
  var h='<div class="q"><span>'+modeName(S.run.mode).ask+'</span><span class="worth" aria-label="Points available">'+gem("#ffbf47",20)+'<span id="worthnow">+'+charWorth()+'</span></span></div><div class="opts">';
  R.opts.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'">'+esc(o.label)+'</button>';});
  h+='</div>';
  if(R.shown<5)h+='<button class="secondary" id="more" style="margin-top:14px">Show next clue (worth +'+CW[R.shown]+')</button>';
  if(P.tokens>0&&R.opts.length>2&&(R.removed||0)<2)h+='<button class="secondary" id="tok" style="margin-top:10px">Remove a wrong option ('+P.tokens+(P.tokens===1?' token':' tokens')+' left)</button>';
  el.innerHTML=h;
  $$(".opt",el).forEach(function(b){b.onclick=function(){charAnswer(+b.dataset.i,b);};});
  var mb=$("#more");if(mb)mb.onclick=moreClue;
  var tk=$("#tok");if(tk)tk.onclick=useToken;
}
function useToken(){
  var R=S.round;
  if(R.locked||R.done||P.tokens<1||R.opts.length<=2||(R.removed||0)>=2)return;
  var wrong=[];R.opts.forEach(function(o,i){if(!o.ok)wrong.push(i);});
  var k=wrong[Math.floor(Math.random()*wrong.length)];
  R.opts.splice(k,1);R.removed=(R.removed||0)+1;P.tokens--;save();sfx.tick();
  charPanel();
}
function moreClue(){
  var R=S.round;
  if(R.locked||R.done||R.shown>=5)return;
  R.shown++;R.used=R.shown;sfx.tick();
  $("#clues").innerHTML=cluesHTML(true);
  charPanel();
}
function charAnswer(i,btn){
  var R=S.round,run=S.run;
  if(R.locked||R.done)return;
  R.locked=true;R.used=R.shown;
  var mb=$("#more");if(mb)mb.disabled=true;
  var o=R.opts[i],btns=$$(".opt");
  if(o.ok){
    var w=charWorth();R.pts=w;run.score+=w;
    btn.classList.add("ok");btns.forEach(function(b){if(b!==btn)b.classList.add("dim");});
    sfx.good();burst(btn,"#2ed39a",12);floatText(btn,"+"+w);updateScore();
    setTimeout(function(){finishRound(true);},700);
  }else{
    btn.classList.add("no");
    btns.forEach(function(b){if(R.opts[+b.dataset.i].ok)b.classList.add("ok");else if(b!==btn)b.classList.add("dim");});
    sfx.bad();vib(120);loseGem();
    setTimeout(function(){finishRound(false);},1100);
  }
}
function charDone(el){
  var R=S.round,run=S.run,last=run.idx>=run.pool.length-1||run.gems<=0;
  var h='<div class="done-card '+(R.ok?"ok":"bad")+'">'+
    '<p class="msg">'+(R.ok?(R.used===1?"Found it from the very first clue.":"You found it."):"This one is")+'</p>'+
    '<div class="big">'+esc(R.c.name)+'</div>';
  if(R.ok){
    h+='<div class="rows"><div><span>Found with '+R.used+(R.used===1?" clue":" clues")+'</span><b>+'+R.pts+'</b></div>'+
       (R.bonus?'<div><span>Streak of '+run.streak+' in a row</span><b>+'+R.bonus+'</b></div>':'')+'</div>';
  }else{
    h+='<p class="msg" style="margin-bottom:14px">'+(run.gems<=0?"You are out of gems. The "+modeName(run.mode).many+" you missed are listed on the next screen so you can read the clues again.":"Read the clues above, then carry on. You have "+run.gems+(run.gems===1?" gem":" gems")+" left.")+'</p>';
  }
  h+='<button class="primary" id="next">'+(last?"See results":modeName(run.mode).next)+'</button></div>';
  el.innerHTML=h;
  $("#next").onclick=nextRound;
}

/* ---------- results ---------- */
function endRun(){
  var run=S.run,L=run.level;
  var passed=run.correct>=PASS&&run.gems>0;
  var stars=run.gems<=0?(run.correct>=5?1:0):(run.correct>=9?3:run.correct>=PASS?2:run.correct>=5?1:0);
  P.runs++;
  var ms=MS(run.mode);
  var newBest=run.score>(ms.best[L]||0);
  if(newBest)ms.best[L]=run.score;
  if(stars>(ms.stars[L]||0))ms.stars[L]=stars;
  var unlocked=null;
  if(passed&&L<LVS(run.mode).length&&!ms.unlocked[L+1]){ms.unlocked[L+1]=true;unlocked=LVS(run.mode)[L];}
  if(run.correct===ROUNDS&&run.gems===GEMS)P.flawless=true;
  var fresh=checkBadges();
  save();
  results(run,passed,stars,newBest,unlocked,fresh);
  if(unlocked){sfx.badge();}
}
function results(run,passed,stars,newBest,unlocked,fresh){
  S.screen="results";
  if(unlocked){fresh=fresh.filter(function(b){return b.id!=="sapphire"&&b.id!=="diamond";});}
  var L=LVS(run.mode)[run.level-1],out=run.gems<=0,i,sg="";
  for(i=0;i<3;i++)sg+=gem(i<stars?"#ffbf47":"#4a3d70",54);
  var noun=run.mode==="verses"?"verses":modeName(run.mode).many;
  var title=out?"Out of gems":(passed?"Well done!":"Good effort");
  var sub=out?("You found "+run.correct+" of "+(run.res.length)+" "+noun+"."):("You found "+run.correct+" of "+run.pool.length+" "+noun+".");
  var h='<div class="res"><div class="bigstars">'+sg+'</div><h2>'+title+'</h2><div class="big">'+fmt(run.score)+'</div>'+
        '<p class="sub">'+sub+(newBest?" That is your best score on "+L.name+".":"")+'</p>';
  if(unlocked)h+='<div class="unlock">'+gem(unlocked.color,30)+' '+unlocked.name+' is unlocked!</div>';
  else if(!passed&&!out)h+='<p class="sub">Get '+PASS+' of '+ROUNDS+' right to unlock the next level.</p>';
  else if(out)h+='<p class="sub">Each run starts with '+GEMS+' fresh gems.</p>';
  if(fresh.length){h+='<div class="unlock" style="background:rgba(46,211,154,.1);border-color:rgba(46,211,154,.6)">New gems: '+fresh.map(function(b){return esc(b.name);}).join(", ")+'</div>';}
  h+='<div class="btns"><button class="primary" id="again">Play '+L.name+' again</button>';
  if(L.n<LVS(run.mode).length&&(passed||MS(run.mode).unlocked[L.n+1]))h+='<button class="secondary" id="nextlv">Play '+LVS(run.mode)[L.n].name+'</button>';
  h+='<button class="secondary" id="home">Back to levels</button></div>';
  if(run.missed.length){
    h+='<div class="review"><h3>'+(run.mode==="verses"?"Verses to read again":(run.mode==="places"?"Places to read about again":"People to read about again"))+'</h3>';
    run.missed.forEach(function(v){
      if(run.mode!=="verses")h+='<div class="rv"><b>'+esc(v.name)+'</b><p>'+v.clues.map(esc).join(" ")+'</p></div>';
      else h+='<div class="rv"><b>'+esc(refOf(v))+'</b><p>'+esc(v.text)+'</p></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  app.innerHTML=h;
  $("#again").onclick=function(){startRun(run.level,run.mode);};
  var nl=$("#nextlv");if(nl)nl.onclick=function(){startRun(L.n+1,run.mode);};
  $("#home").onclick=home;
  window.scrollTo(0,0);
  if(passed||stars>0)setTimeout(function(){sfx.win();},250);
  fresh.forEach(function(b){toast(b);});
}

/* ---------- go ---------- */
window.__SG={charOpts:charOpts,PLACECAT:PLACECAT,PLACEXTRA:PLACEXTRA,S:function(){return S;},P:function(){return P;},home:home,startRun:startRun,parseVerse:parseVerse,buildOpts:buildOpts,VERSES:VERSES,CHARS:CHARS,PLACES:PLACES,loadVerses:loadVerses,BOOKS:BOOKS,CH:CH};
home();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}
})();
</script>
</body>
