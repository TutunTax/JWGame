gods.","Its poor were kept content with free grain and entertainment, such as chariot races in an enormous circus.","Visitors from here were present at Pentecost, and Paul said the faith of its congregation was known worldwide.","Paul arrived here as a prisoner and for two years preached freely to everyone who came to his house."]},{"id":"patmos","level":3,"name":"Patmos","clues":["A small island of volcanic origin, it has a ragged coast and is largely rocky and barren.","Because of its remoteness, it was among the Aegean islands where prisoners were sent.","It lay some 55 km west of Asia Minor, less than 240 km from the seven congregations addressed in a famous book.","Old tradition says an emperor condemned the apostle John to live here, and he was freed after that ruler died.","John was exiled here for speaking about God and witnessing to Jesus, and here he received the Revelation."]},{"id":"cana","level":3,"name":"Cana","clues":["Probably named for reeds, this Galilean village lay at the edge of a plain, north of Nazareth.","It was the hometown of Nathanael, who became one of Jesus' first disciples.","An ancient road ran from here down to the Sea of Galilee and on to Capernaum, so people spoke of coming 'down'.","A king's attendant begged Jesus here to come and heal his dying son, and Jesus cured the boy from afar.","Jesus attended a wedding celebration here and turned water into excellent wine, his first miracle."]},{"id":"hebron","level":3,"name":"Hebron","clues":["One of the oldest cities in Judah's hill country, famous for its vineyards, figs and pomegranates, and blessed with many springs.","When Moses sent twelve spies into the land, giant-like descendants of Anak were living in this city.","Sarah was buried in a nearby cave that Abraham bought from a Hittite, and later patriarchs were laid to rest there too.","Caleb received this city as his inheritance, and it later became both a priestly city and a city of refuge.","David was anointed king here and reigned from this city for seven and a half years before moving his capital to Jerusalem."]},{"id":"beersheba","level":3,"name":"Beer-sheba","clues":["A settlement at the desert's fringe, at the foot of Judah's mountains, where roads from several directions came together.","Thanks to its good water supply, it was a place for farming and grazing and counted among the main cities of Judah.","Hagar and her son Ishmael wandered in the wilderness nearby until God directed her to a well of water.","Abraham planted a tamarisk tree here and made a peace covenant with a Philistine king, giving him seven female lambs.","Abraham named it after the oath sworn there, and it marked the southern limit of the land, opposite Dan in the north."]},{"id":"shechem","level":3,"name":"Shechem","clues":["A hill-country city at the eastern end of a narrow valley, controlling roads that crossed the central part of the land.","On first arriving in Canaan, Abraham camped by the big trees of Moreh nearby and later built an altar to Jehovah.","Jacob bought a piece of land here and buried his household's foreign gods and earrings beneath a large tree nearby.","Jacob's daughter Dinah was violated here, and her brothers Simeon and Levi then killed the men of the city.","Judge Gideon's son Abimelech destroyed it and sowed it with salt, and later Rehoboam was made king here."]},{"id":"bethel","level":3,"name":"Bethel","clues":["A town in the hill country north of Jerusalem that was first known to the Canaanites by a different name.","Abraham camped with this town to the west and Ai to the east, and later he and Lot separated nearby.","Fleeing his brother, Jacob slept here, dreamed of a ladder reaching to heaven, and set up a pillar to mark the spot.","Rebekah's nurse Deborah died and was buried here, and God confirmed there that Jacob's name had changed to Israel.","Jeroboam set up a golden calf here, and also at Dan, making the town a symbol of false worship."]},{"id":"ur","level":3,"name":"Ur","clues":["An ancient Mesopotamian city, once a center of moon-god worship, lying south-east of Babylon.","A man named Haran, brother of Abraham and father of Lot, died in this city.","Jehovah appeared to Abraham in connection with this city and told him to leave his homeland.","Terah took Abraham, Sarah and Lot and moved with them from this city to another one in the north.","The Bible calls it a city \"of the Chaldeans\", and Abraham was likely born there before leaving for Haran and Canaan."]},{"id":"haran","level":3,"name":"Haran","clues":["A city of northern Mesopotamia, standing on a caravan route that linked great cities such as Nineveh, Babylon and Tyre.","Assyrian kings boasted of having conquered it, and Sennacherib used that boast to try to frighten King Hezekiah.","Terah, the father of Abraham, died here after the family left Ur and before Abraham set out for Canaan.","Abraham's oldest servant came to relatives at or near this city to find a wife for Isaac.","Jacob fled here to escape his brother Esau, and at a well he met Rachel, the daughter of his uncle Laban."]},{"id":"gibeon","level":4,"name":"Gibeon","clues":["A hilltop city near Jerusalem, home to Hivites who feared Israel's God when Joshua's armies entered the land.","Its envoys put on worn-out clothes and carried dry, crumbly bread to pretend they had come from a faraway land.","Joshua made a covenant letting its people live, and they were made woodcutters and water carriers for Israel's altar.","When five Amorite kings attacked it, Jehovah hurled hailstones on the enemy and made the daylight last longer for Israel's rescue.","It became a priestly city in Benjamin where the tabernacle stood, and Joab's and Abner's men fought near its pool."]},{"id":"shiloh","level":4,"name":"Shiloh","clues":["A town in Ephraim's hill country, north of Bethel, sitting on a hill that is almost surrounded by higher hills.","After the land was conquered, the apportioning of territory among the tribes of Israel was completed from here.","A yearly festival for Jehovah was held here with circle dances, and Benjamites carried off wives from the dancing women.","For most of the time of the Judges, the tabernacle stood here, and High Priest Eli served at this place.","The Ark was taken from here to battle and captured by Philistines, and Jeremiah later used the ruined town as a warning."]},{"id":"jezreel","level":4,"name":"Jezreel","clues":["A city on the border of Issachar's land, perched at a rocky drop-off overlooking a broad, fertile plain.","Saul's army camped by its spring before facing the Philistines, and news of Saul's and Jonathan's deaths later came from here.","Kings Ahab and Jehoram kept a royal residence here, although Samaria was the real capital of the northern kingdom.","Naboth's vineyard lay beside the palace here, and Elijah announced Jehovah's judgment on Ahab's house in that vineyard.","Jezebel was thrown from a window here and eaten by dogs, and the heads of Ahab's seventy sons lay at its gate."]},{"id":"megiddo","level":4,"name":"Megiddo","clues":["An important city on a mound dominating the western part of a fertile valley, where trade routes and military roads crossed.","Its king was one of 31 beaten by Joshua, yet in the Judges' time Manasseh could not expel the Canaanites from it.","Solomon fortified it, placed it in one of his food-supply districts, and perhaps kept chariot horses here.","Near its waters, Barak defeated Sisera's army with its 900 iron-scythed chariots, and Ahaziah of Judah died here after being wounded.","King Josiah was mortally wounded here after he intercepted Pharaoh Nechoh's army on its way to help the Assyrians."]},{"id":"endor","level":4,"name":"Endor","clues":["A city on the plains, lying in the land of Issachar but handed over to the tribe of Manasseh.","The Canaanites living there were never fully driven out, but were made to do forced labor.","A psalm links it with Jehovah's victory over Sisera, saying many fleeing Canaanites perished there.","Evidently a few miles south of Mount Tabor, it lay in the general region of Taanach and Megiddo.","King Saul went here to consult a spirit medium shortly before dying in battle against the Philistines."]},{"id":"bethsaida","level":4,"name":"Bethsaida","clues":["A Galilean town linked to fishing, which stood near the northern shore of a famous lake.","Philip, Andrew and Peter all came originally from this town.","Outside its limits, Jesus restored the sight of a blind man.","Jesus rebuked its people, together with those of Chorazin, for staying unrepentant despite his mighty works.","After John the Baptizer died, Jesus withdrew here and miraculously fed about five thousand men nearby with a few loaves and fish."]},{"id":"emmaus","level":4,"name":"Emmaus","clues":["A village roughly seven miles from the holy city, whose exact site is still uncertain today.","Two disciples, one named Cleopas, were walking toward it on the day Jesus was raised.","A stranger joined them on the road and explained the Scriptures, though they did not know him.","Only when he reclined with them at the table did they realize who their companion was.","After Jesus vanished from sight at this village's meal, the two hurried back to Jerusalem that same evening."]},{"id":"tarsus","level":4,"name":"Tarsus","clues":["A very ancient city that served as the capital of Cilicia, a Roman province, and was long subject to foreign powers.","It lay in a fertile coastal area where flax grew, supporting linen weaving and tent making.","Its fine harbor sat on a major east-west trade route that passed through the Cilician Gates.","A Greek geographer rated it above Athens and Alexandria as a seat of learning.","This was the hometown of the apostle Paul, who called it no obscure city."]},{"id":"thessalonica","level":4,"name":"Thessalonica","clues":["A major seaport and capital in Macedonia, founded by a ruler who named it for his wife, Alexander the Great's sister.","It stood on the great paved Roman highway across Macedonia, some seventy-five miles west of Philippi.","For three Sabbaths Paul reasoned in its synagogue, and some Jews, many Greeks and prominent women believed.","A mob of idlers attacked Jason's house here, and Paul and Silas were sent away by night to Beroea.","From Corinth, Paul wrote two letters to the Christians of this city, praising their example in Macedonia and Achaia."]},{"id":"lystra","level":4,"name":"Lystra","clues":["A city of Lycaonia in south-central Asia Minor, made a Roman colony, though its natives kept their own language.","The young man Timothy most likely lived here, and the brothers spoke well of him.","Jews arriving from Iconium and Antioch in Pisidia turned the crowds here against Paul, who was stoned and dragged outside.","Paul got up, went back into the city among the disciples, and left for Derbe the next day.","After a man lame from birth was healed, crowds called Paul and Barnabas Zeus and Hermes and tried to sacrifice."]},{"id":"joppa","level":4,"name":"Joppa","clues":["An ancient seaport roughly thirty-four miles west-northwest of Jerusalem, built on a rocky hill.","Its harbor was the only natural anchorage on the coast stretching from Mount Carmel to Egypt's frontier.","Cedar logs from Lebanon were floated here for building and rebuilding God's temple.","The reluctant prophet Jonah boarded a ship here, hoping to flee to Tarshish.","Peter raised the generous Dorcas here, then stayed with Simon the tanner and saw a rooftop vision."]},{"id":"caesarea","level":4,"name":"Caesarea","clues":["A splendid seaport on the Mediterranean coast, built by Herod the Great around an artificial harbor.","It became the residence of the Roman governors of Judea and the main base of their troops.","Philip the evangelizer lived here, and the prophet Agabus warned Paul of coming danger while he stayed.","King Herod Agrippa I retreated here after jailing Peter and soon died, having accepted praise as though he were a god.","Peter baptized the centurion Cornelius here, and Paul, held prisoner under Felix and Festus, appealed to the emperor before sailing for Rome."]},{"id":"ramah","level":5,"name":"Ramah","clues":["Its name simply means a high place, and this town lay in the mountainous region of Ephraim.","A man from here named Elkanah traveled each year to Shiloh to offer sacrifice.","A famous prophet was evidently born here, though he spent some time serving with Eli the priest.","He later made this town his base, traveling a circuit from it to judge Israel.","It was the hometown of Samuel, who was buried at his own house here."]},{"id":"mizpah","level":5,"name":"Mizpah","clues":["Its name means Watchtower, and this city in Benjamin's territory became a gathering place for all Israel.","Israel's fighting men assembled here to act against Gibeah, a war that nearly wiped out a whole tribe.","Samuel gathered the people here to fast and confess sin, and Jehovah threw attacking Philistines into confusion.","Here Samuel presented Saul to the nation as its first king.","After Jerusalem fell, governor Gedaliah ruled from here, where Jeremiah also lived, until Ishmael murdered him."]},{"id":"gilead","level":5,"name":"Gilead","clues":["A fertile highland east of the Jordan, with winter rains and many springs, that once supported great forests and vineyards.","Because of their large herds, Gad and Reuben asked Moses for this land, and half of Manasseh also received a portion.","After Ammonite oppression, the men here dropped false worship and asked a local man, Jephthah, to be their commander.","Fleeing Absalom's rebellion, David was warmly welcomed at Mahanaim here, above all by the old man Barzillai.","The prophet Elijah came from this region, whose Gadite city of refuge was Ramoth and whose balsam was renowned for healing."]},{"id":"moab","level":5,"name":"Moab","clues":["A tableland east of the Dead Sea, cut by deep gorges, where large flocks grazed and vineyards and grain grew.","Its people descended from a son born to Lot's older daughter, so they were distant relatives of the Israelites.","Its king Eglon held Israel in subjection for 18 years until the left-handed Ehud killed him.","Its king Balak hired Balaam to curse Israel, and its desert plains opposite Jericho were where Moses gave his final talks.","A famine drove Naomi's family here from Bethlehem, and her daughter-in-law Ruth later left its gods to serve Jehovah."]},{"id":"hermon","level":5,"name":"Mount Hermon","clues":["A towering limestone mountain with a bare summit, while fir trees, fruit trees and vineyards grow on its lower slopes.","Its snowy head draws moisture from the night air, giving heavy dew that keeps plants alive through the long dry season.","Its melting snows are the main source of the Jordan River, and lions and leopards once roamed there.","It marked the northern limit of the Promised Land, and Joshua defeated the Hivites who lived at its foot.","Possibly the lofty mountain of Jesus' transfiguration, since he had just been at nearby Caesarea Philippi."]},{"id":"tabor","level":5,"name":"Mount Tabor","clues":["An isolated, rounded mountain that rises abruptly from a broad northern valley and looks like a cone from one side.","It stood on the northern boundary of the tribe of Issachar, not far from Nazareth.","A psalmist named it beside Hermon as a showpiece of the Creator's craftsmanship, and Jeremiah likened a king to its solitary bulk.","Here Zebah and Zalmunna, the kings of Midian, killed Gideon's brothers.","From here Barak hurried down with men of Naphtali and Zebulun to rout Sisera's iron-scythed chariots."]},{"id":"gilboa","level":5,"name":"Mount Gilboa","clues":["A curved limestone range, partly bare rock, overlooking a fertile plain in northern Israel.","Wheat and barley are grown on its gentle western slopes, while pasture, fig trees and olive trees are found there too.","At a spring here, the well of Harod, Gideon and his men once camped.","Israel's first king rallied his forces here, and the Philistines defeated him.","Here King Saul took his own life, and his sons Jonathan, Abinadab and Malchishua were killed."]},{"id":"kadesh","level":5,"name":"Kadesh (Kadesh-barnea)","clues":["An Israelite desert camp lying eleven days' travel from Horeb, along the route through Mount Seir.","At Edom's frontier near the way to Shur, it lies in both the Wilderness of Paran and of Zin.","From here Moses asked the king of Edom for permission to cross his land, but the request was refused.","Moses' sister Miriam died here, and Moses and Aaron lost the privilege of entering the Promised Land.","Moses sent twelve men to spy out Canaan from here, and ten of them brought back a bad report."]},{"id":"zoar","level":5,"name":"Zoar","clues":["A city of the Jordan District that evidently once stood at the edge of a fertile plain, near the Dead Sea.","Its king joined four other rulers in rebelling against Chedorlaomer after twelve years, only to be defeated.","A prophecy said fugitives from a devastated Moab would flee here, suggesting it lay close to that land.","When Moses viewed the Promised Land from Mount Nebo, this was the farthest point he saw to the south.","A man asked to flee here from Sodom's destruction, and the city was spared, though he later left to live in caves."]},{"id":"ai","level":5,"name":"Ai","clues":["A royal Canaanite city that stood east of Bethel, close to Beth-aven, with a valley plain lying to its north.","Soon after arriving in Canaan, Abraham pitched his tent between Bethel and this place and built an altar.","After Jericho fell, about 3,000 men attacked, because the spies had said its people were few.","That attack failed because one man, Achan, had secretly kept what belonged to Jehovah.","Once this was set right, Joshua hid an ambush behind it, feigned retreat, and burned the second city Israel captured."]},{"id":"bethshemesh","level":5,"name":"Beth-shemesh","clues":["A town on the northern border of Judah, west of Jerusalem, on the main road toward the Philistine cities.","It guarded a key approach from the coastal plains into the hills of Judah, near the upper valley of Sorek.","Judah gave it to the Levites as a priestly city, and it helped provide food for King Solomon's table.","Here Judah's King Amaziah rashly challenged Jehoash of Israel and was defeated and captured.","Cows pulling a Philistine wagon carrying the ark of the covenant went straight here, and 70 men died for looking inside."]},{"id":"dothan","level":5,"name":"Dothan","clues":["A city on a hill in a small, bowl-like plain between Samaria's hills and the Carmel Range.","Pasture land beside it was crossed by a road running from Gilead to the coast and on to Egypt.","A king of Syria sent a large armed force here to arrest a prophet.","The prophet's terrified servant was shown fiery war equipment of God on the surrounding hills, and the enemy was struck with blindness.","Young Joseph found his brothers pasturing flocks here, and they sold him to a passing caravan of Ishmaelites."]}],"af":[{"id":"jerusalem","level":1,"name":"Jerusalem","clues":["Hoog tussen die heuwels, aan die rand van ’n dorre wildernis, kon jy hierdie stad net bereik deur daarheen op te gaan.","Steil valleie, soos die Kidron en die Hinnom, het dit byna rondom beskerm; slegs die noordekant het geen natuurlike verdediging gehad nie.","Dit het in Dawid se tyd Israel se hoofstad geword en bly hoofstad van die suidelike koninkryk Juda ná die verdeling.","Salomo het hier Jehovah se tempel gebou, en die Bybel noem hierdie stad die heilige stad en die stad van Jehovah.","Jesus het in sy tempel onderrig gegee, en Romeinse leërs onder Titus het hierdie stad later verwoes, net soos hy voorspel het."]},{"id":"bethlehem","level":1,"name":"Betlehem","clues":["Hierdie rotsagtige hoogland-dorpie in Juda, ’n entjie suid van die hoofstad, het olywe, druiwe en graan opgelewer.","Ragel is langs die pad daarheen begrawe, en Naomi het saam met haar Moabitiese skoondogter Rut hierheen teruggekeer.","Boas het hier gewoon, en Dawid het na water uit die dorp se put gesmag toe ’n Filistynse buitepos dit beset het.","’n Jong skaapwagter met die naam Dawid, seun van Isai, is hier gebore en deur Samuel as Israel se toekomstige koning gesalf.","Die profeet Miga het voorspel dat die Messias uit hierdie klein dorpie sou kom, en Jesus is hier gebore."]},{"id":"nazareth","level":1,"name":"Nasaret","clues":["Hierdie Galilese stad het in ’n bergkom gelê, omring deur heuwels, ’n entjie noord van die Jisreël-vallei.","Natanael het getwyfel of daar iets goeds uit hierdie plek kon kom toe hy van die man van daar hoor.","Nadat Josef en Maria saam met die klein kindjie uit Egipte teruggekeer het, het hulle weer in hierdie stad gaan woon.","Kwaai inwoners wou Jesus oor die rand van hulle berg gooi nadat hy in hulle sinagoge uit Jesaja gelees het.","Jesus het in hierdie Galilese stad grootgeword saam met sy halfbroers en halfsusters, lank voordat Johannes hom gedoop het."]},{"id":"egypt","level":1,"name":"Egipte","clues":["’n Lang, smal groen lint landbougrond tussen woestynkranse, hierdie land het gelewe of gesterf by die jaarlikse vloed.","Sy lande het gars, koring en vlas gelewer, en Israeliete in die woestyn het na sy komkommers, preie en knoffel verlang.","Toe hongersnood toeslaan, het Jakob se gesin hierheen gekom vir kos, waar Josef onder die heerser tot ’n hoë posisie opgestyg het.","God se volk het hier tot ’n magtige nasie gegroei, maar later gely onder ’n Farao wat hulle tot slawe gemaak het.","Nadat tien plae hierdie land van die Nyl en die Farao’s getref het, het Moses die Israeliete daaruit gelei."]},{"id":"babylon","level":1,"name":"Babilon","clues":["Hierdie groot stad het weerskante van die Eufraat gelê, op die vlaktes van Sinear, beskerm deur dubbele mure en ’n grag.","Dit was ’n besige wêreldhandelsentrum, vol tempels en afgode, en sy mense het op astrologie en towery vertrou.","Sy koning het geroem dat hy dit in al sy prag gebou het en kosbare houers uit Jehovah se tempel soontoe gevoer.","Hier het Daniël die geheimsinnige skrif op die paleismuur verklaar, die nag toe die Mede en die Perse die stad ingeneem het.","Duisende Jode is as gevangenes hierheen weggevoer, en die apostel Petrus het later sy eerste brief van hier af geskryf."]},{"id":"sinai","level":1,"name":"Berg Sinai","clues":["’n Berg in Arabië, naby waar ’n groot menigte met talle kleinvee en beeste byna ’n jaar lank laer opgeslaan het.","Aan sy voet was daar plek vir ’n groot skare om bymekaar te kom, en ’n bergstroom het van sy hoogtes afgestorm.","Moses het hier naby Jehovah se engel ontmoet, in ’n doringbos wat gebrand het maar nie verteer is nie.","Donder, weerlig, ’n swaar wolk en ’n harde horingklank het gekom terwyl die hele berg gebewe en gerook het.","Moses het hier opgegaan om die Tien Gebooie te ontvang, en Israel het aan sy voet tot die Wetsverbond toegetree."]},{"id":"jordan","level":1,"name":"Jordaanrivier","clues":["Die vernaamste rivier van die Beloofde Land was ’n grens tussen oos en wes en het oorstroom toe Hermon se sneeu smelt.","Dit slinger deur ’n wildernis van doringruigtes waar leeus eens rondgeloop het, van die See van Galilea af na die Dooie See.","’n Melaatse leërowerste is genees nadat hy die profeet se woord gehoorsaam het en sewe keer in sy water gebad het.","Israel het op droë grond oorgesteek toe God sy oorstromende water gestuit het, en Elia en Elisa het dit later ook verdeel.","Johannes die Doper het berouvolle Jode in hierdie rivier gedoop, en Jesus het hier na hom toe gekom om gedoop te word."]},{"id":"eden","level":1,"name":"Tuin van Eden","clues":["Die naam beteken genot, en dit was die naam van ’n streek wat na die ooste gelê het.","God het daar ’n parkagtige oord geplant, en ’n rivier wat uit die streek gevloei het, het die grond nat gemaak.","Sy bome het skoonheid en baie soorte kos gegee, en ’n man is aangewys om dit te bewerk en te versorg.","Daardie man het elke dier en voël genoem wat God in hierdie pragtige tuiste na hom toe gebring het.","Die eerste mensepaar het hierdie oorspronklike tuiste verloor nadat ’n slang hulle versoek het om van die verbode boom te eet."]},{"id":"redsea","level":1,"name":"Rooisee","clues":["Hierdie lang, souterige see lê tussen die noordoostelike hoek van Afrika en Arabië, en sy riwwe en winde pla seevaarders.","Sy noordoostelike arm het die suidelike rand van Edom geraak, en Israel se eie grens sou ook tot daar strek.","’n Farao het vlugtende slawe met sy strydwaens en soldate tot by sy oewer agtervolg, met die see voor hulle.","Jehovah het sy water verdeel sodat die Israeliete op droë grond daardeur kon loop.","Sy water het teruggestorm en Farao se leër verdrink, net nadat Moses Israel oor hierdie see gelei het."]},{"id":"ararat","level":1,"name":"Berg Ararat","clues":["Hierdie bergagtige land het noord van Assirië gelê, in die antieke Armenië naby die oorsprong van die Tigris.","Nadat hulle hul pa, die koning, vermoor het, het twee van Sanherib se seuns na hierdie land gevlug.","Jeremia het sy koninkryk genoem onder dié wat teen Babilon opgeroep sou word, in die sesde eeu v.G.J.","Sy hoogste spits is ’n groot kegel met ’n sneeudak, en plaaslike plekname in die omgewing herinner aan ’n bekende aartsvader.","Noag se ark het ná die Vloed op die berge hier tot rus gekom."]},{"id":"galilee","level":1,"name":"See van Galilea","clues":["'n Varswatermeer in die noorde, ver onder seevlak, wat hoofsaaklik deur die Jordaanrivier gevoed word.","Skielike storms het dit getref omdat windvlae langs die Jordaanvallei van 'n sneeubedekte berg in die noorde afgestorm het.","In die eerste eeu het nege stede aan sy oewers gelê, maar vandag staan net een daarvan nog.","Jesus het hier van 'n boot af die skares geleer en die vissermanne Petrus, Andreas, Jakobus en Johannes geroep.","Langs hierdie noordelike meer het Jesus wind en golwe gekalmeer, op die water geloop en duisende met min brode gevoed."]},{"id":"jericho","level":1,"name":"Jerigo","clues":["Diep in die Jordaanvallei, ver onder seevlak, was hierdie warm stad bekend vir sy palmbome.","Ná die oorsteek van die Jordaan het Israel se leër hierdie Kanaänitiese stad voor enige ander ingeneem.","Twee spioene is hier deur 'n vrou met die naam Rahab versteek, wie se huis op die stadsmuur gestaan het.","Jesus het in hierdie stad by Saggeus tuisgegaan en in die omgewing die blinde Bartimeus genees.","Die Israeliete het ses dae lank daagliks om die stad gemarsjeer, sewe keer op die sewende, en sy mure het geval."]},{"id":"capernaum","level":2,"name":"Kapernaum","clues":["'n Stad aan die oewer van 'n meer in Galilea, belangrik genoeg om 'n belastingkantoor en moontlik 'n militêre pos te hê.","Fonteine wat in die meer vloei, het baie vis gelok en die oewer 'n uitstekende plek vir vissermanne gemaak.","'n Offisier daar, wat 'n sinagoge vir die Jode gebou het, het Jesus gevra om sy siek slaaf te genees.","Jesus het hier Petrus se skoonma genees, en 'n verlamde man is deur die dak neergelaat om by hom uit te kom.","Nadat Jesus Nasaret verlaat het, het hy hierdie stad sy tuiste in Galilea gemaak, en hier het hy die tollenaar Matteus geroep."]},{"id":"damascus","level":2,"name":"Damaskus","clues":["'n Ou Siriese stad op 'n hoë vlakte aan die voet van 'n bergreeks, natgemaak deur 'n bergrivier.","Sy vrugbare oase het dit 'n kruispunt gemaak vir karavane en leërs tussen Mesopotamië, Egipte en Arabië.","Abraham se dienaar Eliëser was 'n man van hierdie stad, en die Siriese konings Ben-Hadad en Hasael het daaruit regeer.","Koning Agas van Juda het hier 'n altaar gesien en 'n namaaksel daarvan vir valse aanbidding laat maak.","Saulus was op pad hierheen om Christene te vervolg toe hy blind geword het, en later het hy in Reguit-straat gebly."]},{"id":"nineveh","level":2,"name":"Nineve","clues":["'n Ou stad wat deur Nimrod gestig is en aan die oostelike oewer van die Tigris gelê het.","Dit het die hoofstad van 'n magtige ryk geword, bekend vir wrede oorlogvoering, waar 'n godin van liefde en oorlog aanbid is.","Koning Sanherib van Assirië is hier in die huis van sy god Nisrog vermoor.","Die profete Nahum en Sefanja het sy ondergang voorspel, en Babilon en Medië het dit later in 'n puinhoop verander.","Jona is gestuur om hierdie groot stad te waarsku; sy inwoners, selfs die koning, het hulle bekeer en God het dit gespaar."]},{"id":"carmel","level":2,"name":"Berg Karmel","clues":["'n Bosryke bergreeks wat in die Middellandse See insteek en in die lente vol blomme is; sy voorgebergte verdeel die kusvlakte.","Sy steil, bosryke hellings het die pad versper, sodat karavane en leërs tussen Mesopotamië en Egipte 'n ander roete moes soek.","Vlugtelinge uit die noordelike koninkryk het in sy grotte en woude weggekruip, maar Amos het gesê hulle kon God nie ontvlug nie.","Van sy top af het Elia gebid dat die lang droogte moes eindig, en sy dienaar het 'n klein wolkie gesien.","Hier het Elia die 450 profete van Baäl voor koning Agab uitgedaag om te wys wie die ware God is."]},{"id":"samaria","level":2,"name":"Samaria","clues":["'n Plat bergtop in die hoogland noord van Jerusalem, maklik verdedigbaar, met 'n uitsig na die verre see.","Koning Omri het die berg by 'n man met die naam Semer gekoop en daar 'n stad begin bou.","Dit het die hoofstad van die tienstamkoninkryk en 'n mededinger van Jerusalem geword, met 'n Baäl-tempel en 'n ivoorhuis.","Die melaatse Naäman het hier genesing kom soek, en later het 'n Siriese beleëring 'n verskriklike hongersnood veroorsaak.","Die Assiriërs het hierdie hoofstad uiteindelik ná 'n beleëring verower en sy vooraanstaande inwoners weggevoer, wat die noordelike koninkryk beëindig het."]},{"id":"bethany","level":2,"name":"Betanië","clues":["'n Beskeie dorpie aan die oostelike helling van 'n bekende heuwelrug, langs 'n ou aanloopweg uit die Jordaanvallei.","Dit het ongeveer twee myl van die hoofstad af gelê, aan die pad wat van Jerigo af opgekom het.","In sy laaste dae het Jesus sy nagte hier deurgebring, ongetwyfeld in die huis van Marta, Maria en Lasarus.","By 'n maaltyd in die huis van Simon die melaatse het Maria duur olie oor Jesus gegiet, en Judas het beswaar gemaak.","Hier het Jesus Lasarus uit die dood opgewek, en van naby hierdie dorp het hy later hemel toe opgevaar."]},{"id":"tyre","level":2,"name":"Tirus","clues":["'n Onafhanklike Fenisiese hawestad buite Israel se grense, beroemd vir sy seevaarders en sy vloot handelskepe.","Sy vakmanne het metaalwerk, glaswerk en pers kleurstof gemaak, en sy groot rykdom het sy handelaars trots gemaak.","Jesus het eenmaal die streek rondom hierdie stad besoek en die dogter van 'n Siro-Fenisiese vrou van 'n demoon bevry.","Esegiël het dit uitgebeeld as 'n pragtige skip wat sou sink, en Nebukadnesar het dit lank beleër.","Sy koning Hiram het sederhout en werkers aan Dawid en Salomo gestuur; Alexander die Grote het 'n pad na sy eiland gebou."]},{"id":"olives","level":2,"name":"Olyfberg","clues":["'n Lang heuwelrug oos van Jerusalem met drie toppe, waarvan die middelste oorkant 'n vallei van die tempelgebied lê.","Sy naam kom van die bome wat dit eens bedek het, totdat 'n Romeinse beleg dit kaal gestroop het.","Koning Dawid het dit kaalvoet en huilend geklim toe hy vir sy opstandige seun Absalom gevlug het.","Jesus het dikwels met sy dissipels in 'n tuin by hierdie berg vergader en het in triomf oor die berg gery.","Hier het Jesus sy dissipels vertel hoe sy teenwoordigheid gekenmerk sou word; ná sy opstanding het hy van hier opgevaar."]},{"id":"gethsemane","level":2,"name":"Getsemane","clues":["Dit was waarskynlik 'n olyfboord, met toerusting om die vrugte te pletter en olie te verkry.","Dit het oos van 'n beroemde stad gelê, anderkant 'n dal, by of naby 'n bekende berg.","Jesus het hier gereeld met sy dissipels bymekaargekom.","Op Pasga-aand het Jesus hom saam met sy getroue dissipels hierheen onttrek om te bid.","Judas Iskariot het Jesus hier gevind en verraai, en 'n gewapende skare het hom toe gevange geneem."]},{"id":"golgotha","level":2,"name":"Golgota","clues":["Vandag staan daar 'n kerk op sy tradisionele plek, gebou nadat 'n keiser uit die vierde eeu 'n heidense tempel afgebreek het.","Dit het net buite die mure van 'n beroemde stad gelê, met 'n pad en 'n graf in 'n tuin naby.","Baie mense dink aan 'n heuwel, maar die Bybel sê dit nooit; dit noem net omstanders wat van ver af toegekyk het.","Die naam van die plek verwys na 'n deel van die menslike kop.","Jesus Christus is hier aan 'n folterpaal tereggestel."]},{"id":"antioch","level":2,"name":"Antiogië (van Sirië)","clues":["Hierdie stad, gestig deur 'n generaal wat dit na sy vader vernoem het, het op die oewer van 'n bevaarbare rivier gelê.","Dit was die hoofstad van 'n Romeinse provinsie en die derde grootste stad van die ryk, net ná Rome en Alexandrië.","Die gemeente in Jerusalem het Barnabas hierheen gestuur, en hy het Paulus van Tarsus laat kom om te help.","Paulus het sy sendingreise van hier af begin, en die gemeente het tydens 'n hongersnood hulp na Jerusalem gestuur.","Hier is die dissipels, onder God se leiding, vir die eerste keer Christene genoem."]},{"id":"corinth","level":2,"name":"Korinte","clues":["Hierdie vooraanstaande Griekse stad het op 'n smal landengte gelê wat die vasteland met die suidelike skiereiland verbind het.","Heffings op vrag oor daardie landengte het dit ryk gemaak, en dit was ook 'n nywerheidsentrum, bekend vir erdewerk en bronswerk.","Die aanbidding van 'n godin, wie se tempel bo-op 'n steil, rotsagtige heuwel gestaan het, het sy sedeloosheid spreekwoordelik gemaak.","Paulus het hier agtien maande gebly, en Jode wat sy boodskap teengestaan het, het hom voor die prokonsul Gallio gebring.","Paulus het twee briewe aan die gemeente hier gerig, en van hier het hy later aan die gemeente in Rome geskryf."]},{"id":"ephesus","level":3,"name":"Efese","clues":["'n Ryk handels- en godsdienssentrum aan die westelike kus van Klein-Asië, op die hoofroete tussen Rome en die Ooste.","Sy mees uitstaande gebou, 'n tempel met honderd marmerkolomme, is deur die ou wêreld onder die sewe wonders gereken.","'n Joodse egpaar het hier agtergebly en Apollos van Alexandrië bygestaan, wat net van Johannes se doop geweet het.","Paulus het twee jaar lank daagliks in Tirannus se skoolouditorium onderrig gegee, en voormalige beoefenaars van towerkunste het hul boekrolle openlik verbrand.","Silwersmede het hier in die teater 'n oproer van twee uur begin, uit vrees dat Paulus die aanbidding van Artemis sou skaad."]},{"id":"athens","level":3,"name":"Atene","clues":["Hierdie Griekse stad, deur berge beskut en naby 'n hawestad, was veral bekend vir geleerdheid, letterkunde en kuns.","Vier skole van filosofie het hier gefloreer, en studente uit die hele ryk het hulle bygewoon.","'n Beroemde tempel het op die heuwel bo die stad gestaan waar Sokrates, Plato en Aristoteles gewoon het.","Paulus was ontsteld oor al die afgode hier, het in die markplein geredeneer, en Stoïsynse en Epikuriese filosowe het hom aangespreek.","Paulus het hier oor 'n altaar 'Aan 'n Onbekende God' gepraat, en 'n regter van die Areopagus het gelowig geword."]},{"id":"philippi","level":3,"name":"Filippi","clues":["Hierdie Masedoniese stad is deur Aleksander die Grote se vader van die Traciërs ontneem en na homself vernoem.","Op sy vlakte het Oktavianus en Markus Antonius die moordenaars van Julius Caesar verslaan, en dit het later 'n Romeinse kolonie geword.","Paulus het hier vir die eerste keer in Europa gepreek, ná 'n nagvisioen by Troas van 'n Masedoniese man.","Op die Sabbat het Paulus hier langs 'n rivier met vroue gepraat, en Lidia het haar hart oopgemaak en is gedoop.","Paulus en Silas het hier in die tronk God geprys, tot 'n aardbewing die deure oopgemaak het en die bewaarder gelowig word."]},{"id":"rome","level":3,"name":"Rome","clues":["Eers 'n klein stad in Latium, is dit op sewe heuwels langs 'n rivier gebou, 'n ent van die see af.","Dit het die regeringsetel geword van die magtigste ryk in Bybeltye, en sy heersers is as gode aanbid.","Sy armes is met gratis graan en vermaak, soos wa-wedrenne in 'n reuse-sirkus, tevrede gehou.","Besoekers van hier was by Pinkster teenwoordig, en Paulus het gesê die geloof van sy gemeente is wêreldwyd bekend.","Paulus het hier as gevangene aangekom en twee jaar lank vryelik gepreek aan almal wat na sy huis gekom het."]},{"id":"patmos","level":3,"name":"Patmos","clues":["'n Klein eiland van vulkaniese oorsprong, met 'n skerp ingekerfde kuslyn en grotendeels rotsagtig en dor.","Weens sy afgeleë ligging was dit een van die Egeïese eilande waarheen gevangenes gestuur is.","Dit het 55 km wes van Klein-Asië gelê, minder as 240 km van die sewe gemeentes aan wie 'n boek gerig is.","Volgens ou oorlewering het 'n keiser die apostel Johannes veroordeel om hier te woon; ná daardie heerser se dood is hy vrygelaat.","Johannes is hierheen verban omdat hy oor God gepraat en van Jesus getuig het, en hier het hy die Openbaring ontvang."]},{"id":"cana","level":3,"name":"Kana","clues":["Waarskynlik na riete vernoem, het hierdie dorpie in Galilea aan die rand van 'n vlakte, noord van Nasaret, gelê.","Dit was die tuisdorp van Natanael, wat een van Jesus se eerste dissipels geword het.","'n Eeue-oue pad het van hier af na die See van Galilea en Kapernaum geloop, daarom het mense gepraat van 'afgaan'.","'n Koninklike beampte het Jesus hier gesmeek om sy sterwende seun te genees, en Jesus het hom van ver af gesond gemaak.","Jesus het hier 'n huweliksfees bygewoon en water in uitstekende wyn verander, sy eerste wonderwerk."]},{"id":"hebron","level":3,"name":"Hebron","clues":["Een van die oudste stede in die bergland van Juda, bekend vir sy wingerde, vye en granate, en geseën met baie fonteine.","Toe Moses twaalf verkenners na die land gestuur het, het die reusagtige Enakiete in hierdie stad gewoon.","Sara is in 'n nabygeleë grot begrawe wat Abraham by 'n Hetiet gekoop het, en later ook ander aartsvaders.","Kaleb het hierdie stad as erfdeel ontvang, en later het dit 'n priesterstad en ook 'n vrystad geword.","Dawid is hier as koning gesalf en het sewe en 'n half jaar hier regeer voordat hy na Jerusalem verskuif het."]},{"id":"beersheba","level":3,"name":"Beer-sheba","clues":["'n Nedersetting aan die rand van die woestyn, onderaan Juda se berge, waar paaie uit verskeie rigtings bymekaargekom het.","Danksy sy goeie watervoorraad was dit 'n plek vir landbou en weiding en het dit tot die vernaamste stede van Juda behoort.","Hagar en haar seun Ismael het in die wildernis daar naby rondgedwaal totdat God haar na 'n put met water gelei het.","Abraham het hier 'n tamariskboom geplant en 'n vredesverbond met 'n Filistynse koning gesluit en vir hom sewe ooilammers gegee.","Abraham het dit genoem na 'n eed wat daar afgelê is, en dit het die land se suidelike grens, teenoor Dan, aangedui."]},{"id":"shechem","level":3,"name":"Sigem","clues":["'n Bergstad aan die oostelike punt van 'n nou vallei, wat die paaie deur die middel van die land beheer het.","Toe Abraham die eerste keer in Kanaän aangekom het, het hy by die groot bome van More gekamp en 'n altaar gebou.","Jakob het hier 'n stuk grond gekoop en sy huisgesin se vreemde gode en oorbelle onder 'n groot boom daar naby begrawe.","Jakob se dogter Dina is hier onteer, en haar broers Simeon en Levi het toe die manne van die stad doodgemaak.","Abimeleg, rigter Gideon se seun, het dit verwoes en met sout besaai, en later is Rehabeam hier as koning aangestel."]},{"id":"bethel","level":3,"name":"Bet-El","clues":["'n Dorp in die bergland noord van Jerusalem wat eers onder 'n ander naam bekend was.","Abraham het sy tent met hierdie dorp in die weste en Ai in die ooste opgeslaan en later van Lot geskei.","Op vlug voor sy broer het Jakob hier geslaap, van 'n leer tot in die hemel gedroom en 'n pilaar opgerig.","Rebekka se oppasser Debora is hier begrawe, en God het hier bevestig dat Jakob se naam na Israel verander is.","Jerobeam het hier 'n goue kalf opgerig, en ook by Dan, en só het die dorp 'n simbool van valse aanbidding geword."]},{"id":"ur","level":3,"name":"Ur","clues":["'n Antieke stad in Mesopotamië, eens 'n middelpunt van maangodaanbidding, suidoos van Babilon geleë.","'n Man met die naam Haran, Abraham se broer en Lot se vader, het in hierdie stad gesterf.","Jehovah het in verband met hierdie stad aan Abraham verskyn en vir hom gesê om sy geboorteland te verlaat.","Tera het Abraham, Sara en Lot geneem en van hierdie stad na 'n ander stad in die noorde getrek.","Die Bybel noem dit 'n stad \"van die Galdeërs\", en Abraham is waarskynlik daar gebore voordat hy na Haran vertrek het."]},{"id":"haran","level":3,"name":"Haran","clues":["'n Stad in Noord-Mesopotamië, geleë op 'n karavaanroete wat groot stede soos Nineve, Babilon en Tirus verbind het.","Assiriese konings het daarop gespog dat hulle dit verower het, en Sanherib het dit gebruik om koning Hiskia bang te maak.","Tera, die vader van Abraham, het hier gesterf nadat die gesin Ur verlaat het en voordat Abraham na Kanaän vertrek het.","Abraham se oudste dienaar het na familie in of naby hierdie stad gekom om 'n vrou vir Isak te soek.","Jakob het hierheen gevlug voor sy broer Esau, en by 'n put het hy Ragel, sy oom Laban se dogter, ontmoet."]},{"id":"gibeon","level":4,"name":"Gibeon","clues":["'n Heuwelstad naby Jerusalem, waar Hewiete gewoon het wat Israel se God gevrees het toe Josua se leërs aankom.","Sy gesante het stukkende klere aangetrek en droë, krummelrige brood saamgedra om voor te gee dat hulle van ver af gekom het.","Josua het 'n verbond gesluit om sy mense te laat lewe, en hulle is houtkappers en waterdraers vir Israel se altaar gemaak.","Toe vyf Amoriete-konings dit aangeval het, het Jehovah haelstene op die vyand laat val en die daglig vir Israel se redding verleng.","Dit was 'n priesterstad in Benjamin waar die tabernakel gestaan het, en Joab en Abner se manne het naby sy dam geveg."]},{"id":"shiloh","level":4,"name":"Silo","clues":["'n Dorp in Efraim se bergland, noord van Bet-El, op 'n heuwel wat byna rondom deur hoër heuwels omring word.","Nadat die land verower is, is die verdeling van gebied onder die stamme van Israel van hier af voltooi.","'n Jaarlikse fees vir Jehovah is hier met sirkeldanse gehou, en Benjaminiete het vrouens van die dansende jong vroue weggegryp.","Gedurende die grootste deel van die tyd van die rigters het die tabernakel hier gestaan, waar hoëpriester Eli gedien het.","Die ark is van hier na die geveg geneem en deur Filistyne gevang, en Jeremia het die verwoeste dorp as waarskuwing gebruik."]},{"id":"jezreel","level":4,"name":"Jisreël","clues":["'n Stad op die grens van Issaskar se gebied, op 'n rotsagtige afdraande wat 'n breë, vrugbare vlakte oorsien.","Saul se leër het by sy fontein gekamp teen die Filistyne, en nuus van Saul se dood het hiervandaan gekom.","Konings Agab en Joram het hier 'n koninklike verblyf gehad, hoewel Samaria die werklike hoofstad van die noordelike koninkryk was.","Nabot se wingerd het langs die paleis gelê, en Elia het in daardie wingerd Jehovah se oordeel oor Agab se huis aangekondig.","Isebel is hier by 'n venster uitgegooi en deur honde opgeëet, en Agab se sewentig seuns se koppe lê by sy poort."]},{"id":"megiddo","level":4,"name":"Megiddo","clues":["'n Belangrike stad op 'n heuwel wat die westelike deel van 'n vrugbare vallei oorheers het, waar handelsroetes en krygspaaie gekruis het.","Sy koning was een van 31 wat Josua verslaan het, maar Manasse kon die Kanaäniete destyds nie verdryf nie.","Salomo het dit versterk, by een van sy voedselvoorsieningsdistrikte ingesluit, en dalk strydwaperde hier aangehou.","By sy waters het Barak Sisera se 900 strydwaens met ysterlemme verslaan, en Ahasia van Juda het hier gewond gesterf.","Koning Josia is hier dodelik gewond nadat hy farao Nego se leër onderskep het wat die Assiriërs te hulp gegaan het."]},{"id":"endor","level":4,"name":"En-dor","clues":["'n Stad op die vlakte, geleë in Issaskar se gebied maar aan die stam van Manasse gegee.","Die Kanaäniete wat daar gewoon het, is nooit heeltemal verdryf nie, maar is tot dwangarbeid gedwing.","'n Psalm verbind dit met Jehovah se oorwinning oor Sisera en sê baie vlugtende Kanaäniete het daar omgekom.","Dit het klaarblyklik 'n paar myl suid van die berg Tabor gelê, in die omgewing van Taänag en Megiddo.","Koning Saul het hierheen gegaan om 'n spiritistiese medium te raadpleeg kort voordat hy in die stryd teen die Filistyne gesterf het."]},{"id":"bethsaida","level":4,"name":"Betsaida","clues":["'n Galilese dorp wat met visvang verbind word en naby die noordelike oewer van 'n bekende meer gelê het.","Filippus, Andreas en Petrus het oorspronklik almal uit hierdie dorp gekom.","Buite sy grense het Jesus 'n blinde man se gesig herstel.","Jesus het sy mense, saam met dié van Gorasin, bestraf omdat hulle ondanks sy kragtige werke nie berou getoon het nie.","Nadat Johannes die Doper gesterf het, het Jesus hierheen getrek en ongeveer vyfduisend mans naby met 'n paar brode en visse gevoed."]},{"id":"emmaus","level":4,"name":"Emmaus","clues":["'n Dorp ongeveer sewe myl van die heilige stad af, waarvan die presiese ligging vandag nog onseker is.","Twee dissipels, van wie een Kleopas genoem is, was op pad soontoe op die dag toe Jesus opgewek is.","'n Vreemdeling het by hulle op die pad aangesluit en die Skrifte verduidelik, al het hulle hom nie geken nie.","Eers toe hy by die tafel saam met hulle aangesit het, het hulle besef wie hul metgesel was.","Nadat Jesus tydens die maaltyd in hierdie dorp uit hul oë verdwyn het, het die twee dieselfde aand na Jerusalem teruggehaas."]},{"id":"tarsus","level":4,"name":"Tarsus","clues":["'n Baie ou stad wat as hoofstad van Silisië, 'n Romeinse provinsie, gedien het en lank aan vreemde moondhede onderworpe was.","Dit het in 'n vrugbare kusgebied gelê waar vlas gegroei het, wat linneweef en tentmaak onderhou het.","Sy goeie hawe het aan 'n belangrike oos-wes-handelsroete gelê wat deur die Silisiese Poort geloop het.","'n Griekse geograaf het dit as sentrum van onderrig bo Atene en Aleksandrië gereken.","Dit was die tuisdorp van die apostel Paulus, wat dit 'n stad van aansien genoem het."]},{"id":"thessalonica","level":4,"name":"Tessalonika","clues":["'n Seehawe en hoofstad in Masedonië, gestig deur 'n heerser wat dit na sy vrou, Alexander die Grote se suster, genoem het.","Dit het aan die groot geplaveide Romeinse hoofweg deur Masedonië gelê, ongeveer vyf-en-sewentig myl wes van Filippi.","Drie sabbatte lank het Paulus in sy sinagoge geredeneer, en party Jode, baie Grieke en vooraanstaande vroue het gelowig geword.","'n Bende ledigaards het hier Jason se huis aangeval, en Paulus en Silas is snags na Berea weggestuur.","Vanuit Korinte het Paulus twee briewe aan die Christene van hierdie stad geskryf en hul voorbeeld in Masedonië en Agaje geprys."]},{"id":"lystra","level":4,"name":"Listra","clues":["'n Stad in Likaonië in die suide van sentraal-Klein-Asië, 'n Romeinse kolonie waarvan die inwoners hul eie taal behou het.","Die jong Timoteus het heel waarskynlik hier gewoon, en die broers het goed oor hom gepraat.","Jode van Ikonium en Antiogië in Pisidië het die skares hier teen Paulus opgesweep, wat gestenig en buite gesleep is.","Paulus het opgestaan, tussen die dissipels die stad weer binnegegaan en die volgende dag na Derbe vertrek.","Ná die genesing van 'n man wat van geboorte af kreupel was, het skares Paulus en Barnabas Zeus en Hermes genoem."]},{"id":"joppa","level":4,"name":"Joppe","clues":["'n Antieke seehawe ongeveer vier-en-dertig myl wes-noordwes van Jerusalem, op 'n rotsagtige heuwel gebou.","Sy hawe was die enigste natuurlike hawe aan die kus tussen die berg Karmel en Egipte se grens.","Sederhout uit Libanon is hierheen gedryf vir die bou en herbou van God se tempel.","Die onwillige profeet Jona het hier aan boord van 'n skip gegaan in die hoop om na Tarsis te vlug.","Petrus het hier die vrygewige Dorkas opgewek, toe by Simon die leerlooier gebly en 'n gesig op die dak gesien."]},{"id":"caesarea","level":4,"name":"Sesarea","clues":["'n Pragtige seehawe aan die Middellandse See-kus, deur Herodes die Grote rondom 'n kunsmatige hawe gebou.","Dit het die woonplek van die Romeinse goewerneurs van Judea en hul vernaamste troepebasis geword.","Filippus die evangelieverkondiger het hier gewoon, en die profeet Agabus het Paulus hier vir komende gevaar gewaarsku.","Koning Herodes Agrippa I het hierheen teruggetrek ná Petrus se gevangenskap en kort daarna gesterf nadat hy goddelike lof aanvaar het.","Petrus het Kornelius hier gedoop, en Paulus het as gevangene onder Felix en Festus op die keiser 'n beroep gedoen."]},{"id":"ramah","level":5,"name":"Rama","clues":["Sy naam beteken eenvoudig 'n hoogte, en hierdie dorp het in die bergagtige streek van Efraim gelê.","'n Man van hier met die naam Elkana het elke jaar na Silo gereis om te offer.","'n Beroemde profeet is hier waarskynlik gebore, al het hy 'n tyd lank by Eli die priester gedien.","Hy het later hierdie dorp sy basis gemaak en van hier 'n kringloop gemaak om Israel te oordeel.","Dit was die tuisdorp van Samuel, wat in sy eie huis hier begrawe is."]},{"id":"mizpah","level":5,"name":"Mispa","clues":["Sy naam beteken Wagtoring, en hierdie stad in Benjamin se gebied het 'n byeenkomsplek vir die hele Israel geword.","Israel se vegters het hier saamgekom om teen Gibea op te tree, 'n oorlog wat byna 'n hele stam uitgewis het.","Samuel het die volk hier laat vas en sonde bely, en Jehovah het aanvallende Filistyne in verwarring gebring.","Hier het Samuel vir Saul aan die volk as hul eerste koning voorgestel.","Ná Jerusalem se val het goewerneur Gedalja van hier af regeer, waar Jeremia ook gewoon het, totdat Ismael hom vermoor het."]},{"id":"gilead","level":5,"name":"Gilead","clues":["'n Vrugbare hoogland oos van die Jordaan, met winterreën en baie fonteine, wat eens groot woude en wingerde onderhou het.","Weens hulle groot kuddes het Gad en Ruben vir Moses hierdie land gevra, en half Manasse het ook 'n deel ontvang.","Ná onderdrukking deur Ammon het die manne hier valse aanbidding laat vaar en 'n plaaslike man, Jefta, as leier gevra.","Op vlug voor Absalom se opstand is Dawid hier by Mahanaim hartlik ontvang, veral deur die bejaarde Barsillai.","Die profeet Elia het uit hierdie streek gekom; sy vrystad was Ramot, en sy balsem was beroemd vir genesing."]},{"id":"moab","level":5,"name":"Moab","clues":["'n Hoogvlakte oos van die Dooie See, deur diep klowe deurkruis, waar groot kuddes gewei het en wingerde en graan gegroei het.","Sy mense stam af van 'n seun van Lot se oudste dogter, en was dus familie van die Israeliete.","Sy koning Eglon het Israel 18 jaar lank onderwerp gehou totdat die linkshandige Ehud hom doodgemaak het.","Sy koning Balak het Bileam gehuur om Israel te vloek, en op sy woestynvlaktes oorkant Jerigo het Moses sy laaste toesprake gehou.","'n Hongersnood het Naomi se gesin van Betlehem hierheen gedryf, en haar skoondogter Rut het later Jehovah gaan dien."]},{"id":"hermon","level":5,"name":"Berg Hermon","clues":["'n Hoogrysende kalksteenberg met 'n kaal kruin, terwyl dennebome, vrugtebome en wingerde op sy laer hange groei.","Sy besneeude kruin trek vog uit die nagtelike lug, wat swaar dou gee wat plante deur die droë seisoen help.","Sy smeltende sneeu is die vernaamste bron van die Jordaanrivier, en leeus en luiperds het eens daar rondgeswerf.","Dit was die noordelike grens van die Beloofde Land, en Josua het die Hewiete wat aan sy voet gewoon het, verslaan.","Moontlik die hoë berg waar Jesus se gedaante verander is, aangesien hy kort tevore by die nabygeleë Sesarea-Filippi was."]},{"id":"tabor","level":5,"name":"Berg Tabor","clues":["'n Alleenstaande, ronde berg wat skielik uit 'n breë noordelike vallei opstyg en van een kant soos 'n keël lyk.","Dit het op die noordelike grens van die stam Issaskar gestaan, nie ver van Nasaret nie.","'n Psalmdigter noem dit saam met Hermon die Skepper se meesterwerk, en Jeremia vergelyk 'n magtige koning met sy eensame grootsheid.","Hier het Seba en Salmunna, die konings van Midian, Gideon se broers doodgemaak.","Van hier het Barak met manne van Naftali en Sebulon afgestorm om Sisera se strydwaens met ysterlemme te verslaan."]},{"id":"gilboa","level":5,"name":"Berg Gilboa","clues":["'n Geboë kalksteenreeks, deels kaal rots, wat oor 'n vrugbare vlakte in die noorde van Israel uitkyk.","Koring en gars word op sy sagte westelike hange verbou, en daar is ook weiveld, vyebome en olyfbome.","By 'n fontein hier, die Harod-fontein, het Gideon en sy manne eens laer opgeslaan.","Israel se eerste koning het sy magte hier bymekaargeroep, en die Filistyne het hom verslaan.","Hier het koning Saul sy eie lewe geneem, en sy seuns Jonatan, Abinadab en Malkisua is gedood."]},{"id":"kadesh","level":5,"name":"Kades (Kades-Barnea)","clues":["'n Israelitiese woestynkamp, elf dae se reis van Horeb af, langs die roete deur die gebergte Seïr.","By Edom se grens naby die pad na Sur lê dit in beide die Wildernis Paran en die Wildernis Sin.","Van hier af het Moses die koning van Edom gevra om deur sy land te mag trek, maar die versoek is geweier.","Moses se suster Mirjam het hier gesterf, en Moses en Aäron het die voorreg verloor om die Beloofde Land in te gaan.","Moses het van hier af twaalf manne gestuur om Kanaän te verken, en tien van hulle het 'n slegte verslag teruggebring."]},{"id":"zoar","level":5,"name":"Soar","clues":["'n Stad in die Jordaandistrik wat klaarblyklik eens aan die rand van 'n vrugbare vlakte naby die Dooie See gestaan het.","Sy koning het saam met vier ander heersers teen Kedorlaomer in opstand gekom ná twaalf jaar, maar is verslaan.","'n Profesie het gesê vlugtelinge uit 'n verwoeste Moab sou hierheen vlug, wat aandui dat dit naby daardie land gelê het.","Toe Moses die Beloofde Land vanaf Berg Nebo bekyk het, was dit die verste punt wat hy in die suide gesien het.","'n Man het gevra om van Sodom se vernietiging hierheen te vlug; die stad is gespaar, waarna hy in grotte gewoon het."]},{"id":"ai","level":5,"name":"Ai","clues":["'n Koninklike Kanaänitiese stad oos van Bet-El, naby Bet-Awen, met 'n valleivlakte aan sy noordekant.","Kort nadat Abraham in Kanaän aangekom het, het hy sy tent tussen Bet-El en hierdie plek opgeslaan en 'n altaar gebou.","Ná Jerigo se val het ongeveer 3 000 man aangeval, omdat die spioene gesê het sy mense is min.","Daardie aanval het misluk omdat een man, Agan, heimlik behou het wat aan Jehovah behoort het.","Ná die regstelling het Josua 'n hinderlaag agter die stad gelê, 'n terugtog voorgewend en die tweede stad wat Israel inneem, verbrand."]},{"id":"bethshemesh","level":5,"name":"Bet-Semes","clues":["'n Dorp aan Juda se noordelike grens, wes van Jerusalem, aan die hoofpad na die Filistynse stede.","Dit het 'n belangrike toegangsroete vanaf die kusvlaktes na die heuwels van Juda bewaak, naby die boonste deel van die Sorek-vallei.","Juda het dit as priesterstad aan die Leviete gegee, en dit het gehelp om kos vir koning Salomo se tafel te voorsien.","Hier het Juda se koning Amasia onverstandig vir Joas van Israel uitgedaag en is hy verslaan en gevange geneem.","Koeie het die verbondsark op 'n wa vanself hierheen gebring, en 70 manne het gesterf omdat hulle daarna gekyk het."]},{"id":"dothan","level":5,"name":"Dotan","clues":["'n Stad op 'n heuwel in 'n klein, komvormige vlakte tussen Samaria se heuwels en die Karmelreeks.","Weiveld daarby is deurkruis deur 'n pad vanaf Gilead na die kus en verder na Egipte.","'n Koning van Sirië het hier 'n groot krygsmag gestuur om 'n profeet te gaan arresteer.","Die profeet se bevreesde dienaar het vurige oorlogstoerusting van God op die omliggende heuwels gesien, en die vyand is met blindheid geslaan.","Die jong Josef het sy broers hier by hulle kuddes gekry, en hulle het hom aan 'n karavaan Ismaeliete verkoop."]}]};

var AC=null;
function tone(f,d,type,v,delay){
  if(!P.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v||0.1,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);
  }catch(e){}
}

function burst(el,color,n){
  if(reduced()||!el||!el.getBoundingClientRect||!el.animate)return;
  var r=el.getBoundingClientRect(),fx=$("#fx"),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(var i=0;i<(n||12);i++){
    var s=document.createElement("i");s.className="spark";
    s.style.left=cx+"px";s.style.top=cy+"px";
    s.style.background=color;
    fx.appendChild(s);
    var a=Math.random()*Math.PI*2,d=40+Math.random()*70;
    var an=s.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},
      {transform:"translate(calc(-50% + "+Math.cos(a)*d+"px),calc(-50% + "+(Math.sin(a)*d-20)+"px)) scale(.2) rotate(200deg)",opacity:0}],
      {duration:650+Math.random()*250,easing:"cubic-bezier(.2,.8,.3,1)"});
    (function(node){an.onfinish=function(){if(node.parentNode)node.parentNode.removeChild(node);};})(s);
  }
}
function floatText(el,text){
  if(reduced()||!el||!el.animate)return;
  var r=el.getBoundingClientRect(),fx=$("#fx"),f=document.createElement("div");
  f.className="float";f.textContent=text;f.style.left=(r.left+r.width/2-24)+"px";f.style.top=(r.top+4)+"px";
  fx.appendChild(f);
  var an=f.animate([{transform:"translateY(0)",opacity:1},{transform:"translateY(-60px)",opacity:0}],{duration:900,easing:"ease-out"});
  an.onfinish=function(){if(f.parentNode)f.parentNode.removeChild(f);};
}

function loadVerses(){
  var src=P.lang==="af"?DATA_AF:DATA;
  VERSES.length=0;CHARS.length=0;PLACES.length=0;
  (CHARDATA[P.lang==="af"?"af":"en"]||[]).forEach(function(c){CHARS.push({id:c.id,level:c.level,name:c.name,clues:c.clues});});
  (PLACEDATA[P.lang==="af"?"af":"en"]||[]).forEach(function(c){PLACES.push({id:c.id,level:c.level,name:c.name,clues:c.clues});});

/* ---------- verse parsing ---------- */
function parseVerse(v){
  var toks=v.text.replace(/—/g,"— ").split(/\s+/).filter(Boolean).map(function(t){
    var m=t.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
    return {pre:m[1],core:m[2],post:m[3],plain:!m[2]};
  });
  var keyToks=v.key.split(/\s+/).map(normWord).filter(Boolean),clue=[],i,k;
  if(keyToks.length){
    for(i=0;i+keyToks.length<=toks.length&&!clue.length;i++){
      var ok=true;
      for(k=0;k<keyToks.length;k++){if(toks[i+k].plain||normWord(toks[i+k].core)!==keyToks[k]){ok=false;break;}}
      if(ok){for(k=0;k<keyToks.length;k++)clue.push(i+k);}
    }
  }
  if(!clue.length){
    var idx=toks.map(function(t,j){return j;}).filter(function(j){return !toks[j].plain;});
    idx.sort(function(a,b){return toks[b].core.length-toks[a].core.length;});
    clue=idx.slice(0,2);
  }
  return {toks:toks,clue:clue};
}

/* ---------- options ---------- */
function groupOf(i){for(var g=0;g<GROUPS.length;g++){if(i>=GROUPS[g][0]&&i<=GROUPS[g][1])return g;}return 0;}
function rangeIdx(g){var a=[];for(var i=GROUPS[g][0];i<=GROUPS[g][1];i++)a.push(i);return a;}
function bookOptions(v,level){
  var ci=BOOKS.indexOf(v.book),g=groupOf(ci),same=rangeIdx(g).filter(function(i){return i!==ci;}),d=[],others;
  var otherG=GROUPS.map(function(_,i){return i;}).filter(function(i){return i!==g;});
  if(level===1){
    pick(otherG,3).forEach(function(gi){d.push(pick(rangeIdx(gi),1)[0]);});
  }else if(level===2){
    d=pick(same,2);d.push(pick(rangeIdx(pick(otherG,1)[0]),1)[0]);
  }else{
    d=pick(same,3);
  }
  while(d.length<3){var c=rint(0,65);if(c!==ci&&d.indexOf(c)<0)d.push(c);}
  return shuffle([ci].concat(d)).map(function(i){return {label:bname(i),ok:i===ci};});
}
function numOptions(correct,lo,hi,count,span){
  var a=Math.max(lo,correct-span),b=Math.min(hi,correct+span),pool=[],i;
  for(i=a;i<=b;i++)if(i!==correct)pool.push(i);
  if(pool.length<count-1){pool=[];for(i=lo;i<=hi;i++)if(i!==correct)pool.push(i);}
  var chosen=pick(pool,count-1).concat([correct]);
  chosen.sort(function(x,y){return x-y;});
  return chosen.map(function(n){return {label:String(n),ok:n===correct};});
}
function buildOpts(v,step,level){
  if(step===0)return bookOptions(v,level);
  var ci=BOOKS.indexOf(v.book);
  if(step===1){
    var N=CH[ci];
    return numOptions(v.ch,1,N,Math.min(4,N),level===1?N:(level===2?8:3));
  }
  var M=VCOUNT[v.book+" "+v.ch]||(v.v+10);
  M=Math.max(M,v.v);
  return numOptions(v.v,1,M,Math.min(4,M),level===1?M:(level===2?10:4));
}
