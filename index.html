<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scripture Gems">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Scripture Gems</title>
<style>
:root{
  --bg:#1a1030; --panel:#2b1f52; --panel2:#352866; --line:#4a3b80;
  --ink:#f6f1ff; --mute:#b9acdd;
  --stone1:#6f6194; --stone2:#43376a;
  --emerald:#2ed39a; --ruby:#ff5d78; --topaz:#ffbf47; --sapphire:#5b9bff; --amethyst:#b184ff; --ice:#8fe9ff;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4}
body{overflow-x:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(155deg,#22154a 0%,#150c28 55%,#1a1030 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   linear-gradient(115deg,transparent 0 36%,rgba(177,132,255,.07) 36% 50%,transparent 50%),
   linear-gradient(62deg,transparent 0 62%,rgba(91,155,255,.06) 62% 76%,transparent 76%)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;
  padding:max(14px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--topaz);outline-offset:3px}
h1,h2,h3,p{margin:0}
.gem{display:block;flex:none}

/* buttons */
.primary{display:block;width:100%;background:linear-gradient(180deg,#ffd37a,#f0a82a);color:#2b1a05;font-weight:700;font-size:1.12rem;
  padding:16px 20px;border-radius:16px;box-shadow:0 5px 0 #a26b0e,0 10px 22px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.primary:active{transform:translateY(4px);box-shadow:0 1px 0 #a26b0e,0 4px 10px rgba(0,0,0,.35)}
.secondary{display:block;width:100%;background:rgba(255,255,255,.07);border:1.5px solid var(--line);font-weight:650;font-size:1.05rem;padding:14px 18px;border-radius:16px}
.secondary:active{background:rgba(255,255,255,.14)}
.icon-btn{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.07);border:1.5px solid var(--line);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* home */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .tr{display:flex;gap:10px}
.lang{display:flex;height:46px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.07);border:1.5px solid var(--line)}
.lang button{padding:0 14px;font-weight:700;font-size:.95rem;color:var(--mute)}
.lang button.on{background:linear-gradient(180deg,#ffd37a,#f0a82a);color:#2b1a05}
.modes{width:max-content;margin:16px auto 0}
.modes button{padding:0 18px}
.clues{display:grid;gap:10px;margin-top:14px}
.clue{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:linear-gradient(160deg,#322460,#251a49);border:1.5px solid var(--line);font-family:var(--serif);font-size:1.12rem;line-height:1.45}
.clue p{margin:0;flex:1;min-width:0}
.clue .cn{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--sans);font-weight:800;font-size:.9rem;background:rgba(255,191,71,.18);color:var(--topaz);margin-top:1px}
.clue.new{border-color:var(--topaz);animation:rise .35s}
.clue.lock{opacity:.5;background:rgba(255,255,255,.04);border-style:dashed;font-family:var(--sans);font-size:.95rem;color:var(--mute);align-items:center}
.clue.lock .cn{margin-top:0;background:rgba(255,255,255,.08);color:var(--mute)}
.hero{text-align:center;padding:2px 0 18px}
.hero .logo{margin:0 auto 10px;filter:drop-shadow(0 8px 22px rgba(177,132,255,.55));animation:logoin .9s cubic-bezier(.2,.9,.3,1.2) both}
.hero .logo .glint{transform-origin:center;animation:glint 1.1s .7s ease-out both}
@keyframes logoin{from{transform:translateY(-14px) scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes glint{0%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1}100%{opacity:0;transform:scale(1.4) rotate(90deg)}}
.hero h1{font-family:var(--serif);font-size:2.35rem;font-weight:700;letter-spacing:.2px;line-height:1.1}
.hero p{color:var(--mute);margin-top:8px;font-size:1.05rem}
.chips{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px 7px 10px;font-weight:650;font-size:.98rem}
.sect{font-family:var(--serif);font-size:1.25rem;font-weight:700;margin:22px 2px 12px}
.lvl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;margin-bottom:12px;
  background:linear-gradient(135deg,var(--panel2),var(--panel));border:1.5px solid var(--line);box-shadow:0 5px 0 #17102c;transition:transform .08s,box-shadow .08s}
.lvl:not([disabled]):active{transform:translateY(3px);box-shadow:0 2px 0 #17102c}
.lvl[disabled]{opacity:.62;cursor:default}
.lvl .gtile{width:62px;height:62px;border-radius:16px;background:rgba(0,0,0,.25);display:grid;place-items:center;flex:none}
.lvl .info{flex:1;min-width:0}
.lvl .nm{font-family:var(--serif);font-size:1.3rem;font-weight:700}
.lvl .sub{color:var(--mute);font-size:.95rem}
.lvl .meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:.92rem;color:var(--mute)}
.lvl .lock{width:26px;height:26px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.stars{display:flex;gap:3px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge{text-align:center;padding:12px 6px 10px;border-radius:18px;background:rgba(255,255,255,.05);border:1.5px solid var(--line)}
.badge .med{width:54px;height:54px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#4a3b80,#241a47);border:2px solid var(--line)}
.badge b{display:block;font-size:.86rem;line-height:1.2}
.badge small{display:block;color:var(--mute);font-size:.76rem;line-height:1.25;margin-top:2px}
.badge.off .med .gem{filter:grayscale(1) brightness(.55)}
.badge.off b{color:var(--mute)}
.foot{text-align:center;color:var(--mute);font-size:.8rem;margin-top:26px;line-height:1.5}

/* play */
.hud{display:flex;align-items:center;gap:12px}
.hud-mid{flex:1;min-width:0;text-align:center}
.lvname{font-family:var(--serif);font-weight:700;font-size:1.08rem}
.vnum{color:var(--mute);font-size:.9rem}
.dots{display:flex;justify-content:center;gap:5px;margin-top:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16)}
.dots i.ok{background:var(--emerald)}
.dots i.no{background:var(--ruby)}
.dots i.cur{background:transparent;box-shadow:0 0 0 2px var(--topaz)}
.score{min-width:64px;text-align:right;font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.score.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25);color:var(--topaz)}}
.gems{display:flex;justify-content:center;gap:10px;margin:14px 0 12px}
.gems .gem{transition:filter .3s,opacity .3s}
.gems .gem.lost{filter:grayscale(1) brightness(.5);opacity:.5;animation:crack .55s}
@keyframes crack{0%{transform:scale(1)}25%{transform:scale(1.35) rotate(-10deg)}55%{transform:scale(.8) rotate(12deg)}100%{transform:scale(1)}}
.slab{background:linear-gradient(160deg,#322460,#251a49);border:1.5px solid var(--line);border-radius:22px;padding:20px 18px;
  font-family:var(--serif);font-size:1.3rem;line-height:2.1;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.3)}
.word{white-space:nowrap}
.p.post{margin-left:-.2em}
.p.pre{margin-right:-.2em}
.tile{position:relative;display:inline-block;padding:0 .24em;line-height:1.4;font:inherit;color:transparent;user-select:none;-webkit-user-select:none;
  background:linear-gradient(135deg,var(--stone1),var(--stone2));
  clip-path:polygon(.36em 0,calc(100% - .36em) 0,100% .36em,100% calc(100% - .36em),calc(100% - .36em) 100%,.36em 100%,0 calc(100% - .36em),0 .36em);
  transition:background .35s,color .35s}
.tile::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,.24) 0 30%,transparent 30% 62%,rgba(0,0,0,.22) 62%);transition:opacity .3s}
.tile::after{content:"";position:absolute;inset:-6px -2px}
.tile:not(.open):active{filter:brightness(1.25)}
.tile.open{background:rgba(255,255,255,.05);color:var(--ink);cursor:default}
.tile.open::before{opacity:0}
.tile.clue{color:var(--topaz);background:rgba(255,191,71,.14);text-shadow:0 0 14px rgba(255,191,71,.55)}
.tile.clue::before{opacity:1;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);animation:sweep 1s .35s ease-out both}
@keyframes sweep{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
.tile.fresh{animation:polish .5s}
@keyframes polish{0%{filter:brightness(2.2)}100%{filter:none}}
.meter{margin:12px 2px 4px;color:var(--mute);font-size:.95rem}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--amethyst),var(--topaz));transition:width .35s}
#panel{margin-top:14px}
.ref{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;margin-bottom:14px}
.seg{border-radius:14px;padding:7px 10px 8px;background:rgba(255,255,255,.05);border:1.5px solid transparent;min-width:0}
.seg small{display:block;color:var(--mute);font-size:.78rem}
.seg b{display:block;font-family:var(--serif);font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.done{background:rgba(46,211,154,.13);border-color:rgba(46,211,154,.5)}
.seg.cur{border-color:var(--topaz);background:rgba(255,191,71,.1);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,191,71,.18)}}
.q{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
.q span:first-child{font-family:var(--serif);font-size:1.3rem;font-weight:700}
.worth{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--topaz);background:rgba(255,191,71,.12);padding:5px 12px 5px 8px;border-radius:999px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{min-height:70px;padding:10px;border-radius:18px;font-size:1.12rem;font-weight:700;line-height:1.2;
  background:linear-gradient(180deg,#43357a,#33266a);border:1.5px solid var(--line);box-shadow:0 5px 0 #17102c;
  transition:transform .08s,box-shadow .08s,opacity .2s}
.opt.num{font-size:1.7rem;font-family:var(--serif)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #17102c}
.opt.ok{background:linear-gradient(180deg,#46eab5,#1fb583);color:#05281c;border-color:#b6ffe6}
.opt.no{background:linear-gradient(180deg,#ff8196,#e63e5f);color:#34060f;border-color:#ffc0cb;animation:shake .4s}
.opt.dim{opacity:.4}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.done-card{border-radius:22px;padding:18px;border:1.5px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));animation:rise .4s}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.done-card.ok{border-color:rgba(46,211,154,.7)}
.done-card.bad{border-color:rgba(255,93,120,.6)}
.done-card .msg{color:var(--mute);font-size:1rem}
.done-card .big{font-family:var(--serif);font-size:2rem;font-weight:700;margin:2px 0 10px}
.rows{margin:0 0 16px;display:grid;gap:6px;font-size:1rem}
.rows div{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.14);padding-bottom:6px}
.rows b{font-variant-numeric:tabular-nums}

/* results */
.res{text-align:center;padding-top:10px}
.res h2{font-family:var(--serif);font-size:1.9rem;line-height:1.15;margin-top:12px}
.res .big{font-size:3.2rem;font-weight:800;font-variant-numeric:tabular-nums;margin:10px 0 0;line-height:1}
.res .sub{color:var(--mute);margin:4px 0 14px}
.bigstars{display:flex;justify-content:center;gap:12px;margin:8px 0}
.bigstars .gem{animation:starin .6s both}
.bigstars .gem:nth-child(2){animation-delay:.2s}
.bigstars .gem:nth-child(3){animation-delay:.4s}
@keyframes starin{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.unlock{margin:14px 0;padding:14px;border-radius:18px;background:rgba(255,191,71,.12);border:1.5px solid rgba(255,191,71,.6);font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:12px}
.review{text-align:left;margin-top:18px}
.review h3{font-family:var(--serif);font-size:1.2rem;margin-bottom:10px}
.rv{padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);margin-bottom:10px}
.rv b{display:block;color:var(--topaz);margin-bottom:4px}
.rv p{font-family:var(--serif);font-size:1.08rem;line-height:1.6}
.btns{display:grid;gap:12px;margin-top:18px}

/* overlays */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.spark{position:absolute;width:11px;height:11px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.float{position:absolute;font-weight:800;font-size:1.35rem;color:var(--topaz);text-shadow:0 2px 8px rgba(0,0,0,.6)}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,140%);z-index:60;
  display:flex;align-items:center;gap:12px;padding:12px 18px 12px 14px;border-radius:18px;background:#fff;color:#241a47;font-weight:700;
  box-shadow:0 12px 30px rgba(0,0,0,.45);transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .3s,visibility 0s .45s;max-width:92vw;
  opacity:0;visibility:hidden}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .3s,visibility 0s}
#toast small{display:block;font-weight:500;color:#5b4f7d}
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,5,24,.72);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:480px;background:linear-gradient(160deg,#3a2c72,#2b1f52);border-radius:26px 26px 0 0;border:1.5px solid var(--line);border-bottom:0;
  padding:22px 20px max(22px,env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet h2{font-family:var(--serif);font-size:1.5rem;margin-bottom:12px}
.sheet ol{margin:0 0 18px;padding-left:22px;font-size:1.05rem;line-height:1.5}
.sheet li{margin-bottom:8px}
.sheet .btns{margin-top:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){.slab{font-size:1.18rem}.hero h1{font-size:2rem}}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>

tthew", "ch": 22, "v": 37, "text": "He said to him: “‘You must love Jehovah your God with your whole heart and with your whole soul and with your whole mind.’", "key": "your whole heart"}, {"book": "Matthew", "ch": 24, "v": 14, "text": "And this good news of the Kingdom will be preached in all the inhabited earth for a witness to all the nations, and then the end will come.", "key": "this good news"}, {"book": "Proverbs", "ch": 27, "v": 11, "text": "Be wise, my son, and make my heart rejoice, So that I can make a reply to him who taunts me.", "key": "make my heart rejoice"}, {"book": "2 Timothy", "ch": 3, "v": 1, "text": "But know this, that in the last days critical times hard to deal with will be here.", "key": "critical times hard to"}], "2": [{"book": "Philippians", "ch": 4, "v": 6, "text": "Do not be anxious over anything, but in everything by prayer and supplication along with thanksgiving, let your petitions be made known to God;", "key": "by prayer and supplication"}, {"book": "Romans", "ch": 12, "v": 1, "text": "Therefore, I appeal to you by the compassions of God, brothers, to present your bodies as a living sacrifice, holy and acceptable to God, a sacred service with your power of reason.", "key": "a living sacrifice"}, {"book": "Hebrews", "ch": 10, "v": 25, "text": "not forsaking our meeting together, as some have the custom, but encouraging one another, and all the more so as you see the day drawing near.", "key": "forsaking our meeting together"}, {"book": "Hebrews", "ch": 11, "v": 6, "text": "Moreover, without faith it is impossible to please God well, for whoever approaches God must believe that he is and that he becomes the rewarder of those earnestly seeking him.", "key": "impossible to please God"}, {"book": "Proverbs", "ch": 3, "v": 5, "text": "Trust in Jehovah with all your heart, And do not rely on your own understanding.", "key": "do not rely on"}, {"book": "John", "ch": 13, "v": 35, "text": "By this all will know that you are my disciples—if you have love among yourselves.”", "key": "you are my disciples"}, {"book": "Colossians", "ch": 3, "v": 13, "text": "Continue putting up with one another and forgiving one another freely even if anyone has a cause for complaint against another. Just as Jehovah freely forgave you, you must also do the same.", "key": "forgiving one another freely"}, {"book": "Psalms", "ch": 86, "v": 5, "text": "For you, O Jehovah, are good and ready to forgive; You abound in loyal love for all those who call on you.", "key": "ready to forgive"}, {"book": "Romans", "ch": 15, "v": 4, "text": "For all the things that were written beforehand were written for our instruction, so that through our endurance and through the comfort from the Scriptures we might have hope.", "key": "written for our instruction"}, {"book": "Psalms", "ch": 103, "v": 14, "text": "For he well knows how we are formed, Remembering that we are dust.", "key": "how we are formed"}, {"book": "2 Timothy", "ch": 3, "v": 16, "text": "All Scripture is inspired of God and beneficial for teaching, for reproving, for setting things straight, for disciplining in righteousness,", "key": "inspired of God"}, {"book": "Hebrews", "ch": 13, "v": 5, "text": "Let your way of life be free of the love of money, while you are content with the present things. For he has said: “I will never leave you, and I will never abandon you.”", "key": "never leave you"}], "3": [{"book": "Proverbs", "ch": 17, "v": 17, "text": "A true friend shows love at all times And is a brother who is born for times of distress.", "key": "brother who is born"}, {"book": "Psalms", "ch": 133, "v": 1, "text": "Look! How good and how pleasant it is For brothers to dwell together in unity!", "key": "dwell together in unity"}, {"book": "Psalms", "ch": 55, "v": 22, "text": "Throw your burden on Jehovah, And he will sustain you. Never will he allow the righteous one to fall.", "key": "Throw your burden"}, {"book": "Ephesians", "ch": 5, "v": 16, "text": "making the best use of your time, because the days are wicked.", "key": "making the best use"}, {"book": "James", "ch": 1, "v": 5, "text": "So if any one of you is lacking in wisdom, let him keep asking God, for he gives generously to all and without reproaching, and it will be given him.", "key": "lacking in wisdom"}, {"book": "Matthew", "ch": 6, "v": 9, "text": "“You must pray, then, this way: “‘Our Father in the heavens, let your name be sanctified.", "key": "Father in the heavens"}, {"book": "Hebrews", "ch": 4, "v": 12, "text": "For the word of God is alive and exerts power and is sharper than any two-edged sword and pierces even to the dividing of soul and spirit, and of joints from the marrow, and is able to discern thoughts and intentions of the heart.", "key": "two-edged sword"}, {"book": "Acts", "ch": 3, "v": 19, "text": "“Repent, therefore, and turn around so as to get your sins blotted out, so that seasons of refreshing may come from Jehovah himself", "key": "seasons of refreshing"}, {"book": "1 Thessalonians", "ch": 5, "v": 14, "text": "On the other hand, we urge you, brothers, to warn the disorderly, speak consolingly to those who are depressed, support the weak, be patient toward all.", "key": "warn the disorderly"}, {"book": "Ephesians", "ch": 4, "v": 26, "text": "Be wrathful, but do not sin; do not let the sun set while you are still angry;", "key": "let the sun set"}, {"book": "Philippians", "ch": 4, "v": 13, "text": "For all things I have the strength through the one who gives me power.", "key": "I have the strength"}, {"book": "1 Peter", "ch": 5, "v": 8, "text": "Keep your senses, be watchful! Your adversary, the Devil, walks about like a roaring lion, seeking to devour someone.", "key": "like a roaring lion"}]}};

var DATA_AF = {"translation": "Nuwe Wêreld-vertaling", "levels": {"1": [{"book": "John", "ch": 3, "v": 16, "text": "“Want God het die wêreld so liefgehad dat hy sy eniggebore Seun gegee het, sodat elkeen wat geloof in hom beoefen, nie vernietig sal word nie, maar die ewige lewe kan hê.", "key": "eniggebore Seun"}, {"book": "Matthew", "ch": 6, "v": 33, "text": "“Hou dan aan om eers die Koninkryk en sy regverdigheid te soek, en al hierdie ander dinge sal vir julle bygevoeg word.", "key": "eers die Koninkryk"}, {"book": "Acts", "ch": 20, "v": 35, "text": "Ek het in alles vir julle gewys dat julle deur hard te werk die swakkes moet help en die woorde van die Here Jesus moet onthou, toe hy self gesê het: ‘Dit maak ’n mens gelukkiger om te gee as om te ontvang.’”", "key": "gelukkiger om te gee"}, {"book": "Matthew", "ch": 28, "v": 19, "text": "Gaan dus en maak dissipels van mense van al die nasies, en doop hulle in die naam van die Vader en van die Seun en van die heilige gees,", "key": "maak dissipels van mense"}, {"book": "James", "ch": 4, "v": 8, "text": "Kom nader aan God, en hy sal nader aan julle kom. Reinig julle hande, julle sondaars, en suiwer julle harte, julle besluiteloses.", "key": "Kom nader aan God"}, {"book": "Revelation", "ch": 21, "v": 4, "text": "En God sal elke traan van hulle oë afvee, en die dood sal nie meer daar wees nie. Daar sal geen getreur, geen gehuil en geen pyn meer wees nie. Die vorige dinge is verby.”", "key": "elke traan van hulle"}, {"book": "Isaiah", "ch": 48, "v": 17, "text": "Dít is wat Jehovah sê, jou Terugkoper, die Heilige van Israel: “Ek, Jehovah, is jou God, die Een wat jou leer om jouself te bevoordeel, die Een wat jou lei op die weg wat jy moet volg.", "key": "Terugkoper, die Heilige"}, {"book": "John", "ch": 17, "v": 3, "text": "Om die ewige lewe te ontvang, moet hulle u leer ken, die enigste ware God, en ook die een wat u gestuur het, Jesus Christus.", "key": "enigste ware God"}, {"book": "Matthew", "ch": 22, "v": 37, "text": "Hy het vir hom gesê: “‘Jy moet Jehovah jou God liefhê met jou hele hart en met jou hele siel en met jou hele verstand.’", "key": "jou hele hart"}, {"book": "Matthew", "ch": 24, "v": 14, "text": "Hierdie goeie nuus van die Koninkryk sal oor die hele bewoonde aarde verkondig word as ’n getuienis vir al die nasies, en dan sal die einde kom.", "key": "Hierdie goeie nuus"}, {"book": "Proverbs", "ch": 27, "v": 11, "text": "Wees wys, my seun, en maak my hart bly, sodat ek hom wat my uittart, ’n antwoord kan gee.", "key": "maak my hart bly"}, {"book": "2 Timothy", "ch": 3, "v": 1, "text": "Maar weet dat daar in die laaste dae swaar tye sal wees wat moeilik is om deur te kom.", "key": "swaar tye sal wees"}], "2": [{"book": "Philippians", "ch": 4, "v": 6, "text": "Moet oor niks bekommerd wees nie, maar vra God in elke situasie om julle te help deur tot hom te bid, hom te smeek en hom te dank.", "key": "deur tot hom te bid"}, {"book": "Romans", "ch": 12, "v": 1, "text": "Broers, aangesien God genadig teenoor ons is, smeek ek julle om julle liggame aan te bied as ’n offerande wat lewend, heilig en vir God aanvaarbaar is. So doen julle heilige diens met julle denkvermoë.", "key": "offerande wat lewend"}, {"book": "Hebrews", "ch": 10, "v": 25, "text": "Ons moenie ons vergaderingbywoning verwaarloos, soos party die gewoonte het nie, maar ons moet mekaar aanmoedig, en ons moet dit al hoe meer doen terwyl ons die dag sien nader kom.", "key": "ons vergaderingbywoning verwaarloos"}, {"book": "Hebrews", "ch": 11, "v": 6, "text": "Wat meer is, sonder geloof is dit onmoontlik om God se goedkeuring te verkry, want as iemand God wil nader, moet hy glo dat hy bestaan en dat hy die beloner word van dié wat hom ernstig soek.", "key": "onmoontlik om God se goedkeuring"}, {"book": "Proverbs", "ch": 3, "v": 5, "text": "Vertrou op Jehovah met jou hele hart, en moenie op jou eie begrip staatmaak nie.", "key": "moenie op jou eie begrip"}, {"book": "John", "ch": 13, "v": 35, "text": "So sal almal weet dat julle my dissipels is – as julle liefde vir mekaar het.”", "key": "julle my dissipels is"}, {"book": "Colossians", "ch": 3, "v": 13, "text": "Hou aan om mekaar te verdra en mekaar vryelik te vergewe, selfs al het iemand ’n rede om oor iemand anders te kla. Net soos Jehovah julle vryelik vergewe het, so moet julle ook vergewe.", "key": "mekaar vryelik te vergewe"}, {"book": "Psalms", "ch": 86, "v": 5, "text": "Want u, o Jehovah, is goed en vergewe vryelik. U is vol lojale liefde vir almal wat u aanroep.", "key": "vergewe vryelik"}, {"book": "Romans", "ch": 15, "v": 4, "text": "Want alles wat vroeër geskryf is, is geskryf sodat ons daaruit kan leer, sodat ons deur ons volharding en deur die vertroosting uit die Skrif hoop kan hê.", "key": "daaruit kan leer"}, {"book": "Psalms", "ch": 103, "v": 14, "text": "Want hy weet goed hoe ons gevorm is, en hy hou in gedagte dat ons stof is.", "key": "hoe ons gevorm is"}, {"book": "2 Timothy", "ch": 3, "v": 16, "text": "Die hele Skrif is deur God geïnspireer en is nuttig om te onderrig, om tereg te wys, om dinge reg te stel, om in regverdigheid te dissiplineer,", "key": "deur God geïnspireer"}, {"book": "Hebrews", "ch": 13, "v": 5, "text": "Julle lewenswyse moet vry wees van die liefde vir geld, terwyl julle tevrede is met die dinge wat julle nou het. Want hy het gesê: “Ek sal jou nooit verlaat nie en jou nooit in die steek laat nie.”", "key": "jou nooit verlaat nie"}], "3": [{"book": "Proverbs", "ch": 17, "v": 17, "text": "’n Ware vriend betoon altyd liefde en is ’n broer gedurende moeilike tye.", "key": "broer gedurende moeilike tye"}, {"book": "Psalms", "ch": 133, "v": 1, "text": "Kyk! Hoe goed en hoe aangenaam is dit as broers in eenheid bymekaar woon!", "key": "in eenheid bymekaar woon"}, {"book": "Psalms", "ch": 55, "v": 22, "text": "Gee jou las vir Jehovah, en hy sal jou ondersteun. Hy sal die regverdige nooit laat val nie.", "key": "Gee jou las"}, {"book": "Ephesians", "ch": 5, "v": 16, "text": "en maak die beste gebruik van julle tyd, want die dae is goddeloos.", "key": "maak die beste gebruik"}, {"book": "James", "ch": 1, "v": 5, "text": "As een van julle dan wysheid nodig het, moet hy aanhou om God te vra, want hy gee oorvloedig aan almal sonder om te verwyt, en hy sal wysheid ontvang.", "key": "wysheid nodig het"}, {"book": "Matthew", "ch": 6, "v": 9, "text": "“Julle moet dan só bid: “‘Ons Vader in die hemel, laat u naam geheilig word.", "key": "Ons Vader in die hemel"}, {"book": "Hebrews", "ch": 4, "v": 12, "text": "Want die woord van God is lewend en kragtig en skerper as enige tweesnydende swaard. Dit dring diep in ’n mens in en skei siel en gees, en dit skei die gewrigte van die murg, en dit kan gedagtes en bedoelings van die hart openbaar.", "key": "tweesnydende swaard"}, {"book": "Acts", "ch": 3, "v": 19, "text": "“Toon dus berou en draai om sodat julle sondes uitgewis kan word. Dan sal Jehovah self tye van verfrissing bring", "key": "tye van verfrissing"}, {"book": "1 Thessalonians", "ch": 5, "v": 14, "text": "Aan die ander kant spoor ons julle aan, broers: Waarsku dié wat ongehoorsaam is, praat vertroostend met dié wat terneergedruk is, ondersteun dié wat swak is, wees geduldig met almal.", "key": "Waarsku dié wat ongehoorsaam is"}, {"book": "Ephesians", "ch": 4, "v": 26, "text": "Wees kwaad, maar moenie sondig nie. Moenie toelaat dat die son ondergaan terwyl julle nog kwaad is nie,", "key": "son ondergaan"}, {"book": "Philippians", "ch": 4, "v": 13, "text": "Vir alles is ek sterk genoeg deur hom wat my krag gee.", "key": "sterk genoeg deur hom"}, {"book": "1 Peter", "ch": 5, "v": 8, "text": "Bly helder van verstand, bly wakker! Julle teenstander, die Duiwel, loop rond soos ’n brullende leeu, op soek na iemand om te verslind.", "key": "brullende leeu"}]}};

var CHARDATA={"en":[{"id":"abel","level":1,"name":"Abel","clues":["He came into the world in humanity's earliest generation, to parents who had been banished from their garden home.","He took up shepherding, while his older brother worked the soil.","He chose the best of his flock to offer to Jehovah, and God looked on him with favor.","His own brother grew bitter over God's approval, invited him into a field, and killed him.","He was the second son of Adam and Eve, murdered by his brother Cain."]},{"id":"noah","level":1,"name":"Noah","clues":["He grew up in a violent age when rebel angels and their giant sons had made the earth far worse.","He preached righteousness to a godless society, yet Jesus said the people of his day took no note.","With his family's help, he spent decades building an enormous chest of resinous wood sealed with tar.","God told him to bring his household and animals of every kind aboard, and then Jehovah himself shut the door.","He built the ark and survived the worldwide Flood with his family."]},{"id":"abraham","level":1,"name":"Abraham","clues":["He belonged to the tenth generation after the Flood, in a wealthy city whose towering temple honored a moon god.","His father was caught up in idolatry, yet he rejected it and tried to follow the ark-builder's walk with God.","God told him to leave his land and relatives for a country not yet named, so he took his wife and nephew.","God promised he would grow into a mighty nation, and in Canaan, after crossing the Euphrates, he built altars to Jehovah.","His new name meant \"Father of a Multitude,\" and Paul called him the forefather of everyone who has faith."]},{"id":"sarah","level":1,"name":"Sarah","clues":["She was remarkable for her loveliness, yet even more for her deep faith in Jehovah.","She and her husband had no children of their own, but they took in an orphaned nephew.","She lived in a wealthy city steeped in false worship, yet she and her husband were willing to be different.","No longer young, she willingly left her comfortable home for an unknown land with her husband, nephew, and aged father-in-law.","God later gave her a new name meaning \"Princess,\" and her husband is remembered as the forefather of all who have faith."]},{"id":"ruth","level":1,"name":"Ruth","clues":["She grew up in a small land beyond the Dead Sea's eastern shore, where people worshipped many gods.","She became a widow before she had borne any children, and so did her sister-in-law Orpah.","Unlike Orpah, she refused to go back to her own people and gods, and traveled with her husband's mother to Bethlehem.","At the barley harvest she gleaned in the field of a wealthy relative of her late husband's family, who noticed her loyalty.","A Moabite woman who married Boaz, she became an ancestress of King David and of Jesus."]},{"id":"elijah","level":1,"name":"Elijah","clues":["A prophet in Israel's ten-tribe kingdom, sent by Jehovah to announce a long drought to a wicked king.","He asked wavering Israelites how long they would limp between two opinions, urging them to choose either Jehovah or Baal.","From a mountaintop he sent his attendant seven times to look toward the sea, until a small cloud appeared.","Fearing a queen, he fled, asked to die under a broom tree, and an angel fed him.","On Mount Carmel fire from heaven consumed his sacrifice; later he was told to anoint Elisha as his successor."]},{"id":"jonah","level":1,"name":"Jonah","clues":["A prophet from Gath-hepher, near the town where Jesus would later grow up, who served in the days of Jeroboam II.","Told to go east, he went west to Joppa and boarded a ship bound for Tarshish.","A storm struck the ship, the lots pointed to him, and he told the sailors to throw him overboard.","For three days and nights he was inside a great fish that Jehovah appointed, before being vomited onto dry land.","He warned Nineveh, was angry when the city was spared, and learned a lesson in mercy from a gourd plant."]},{"id":"esther","level":1,"name":"Esther","clues":["A Jewish orphan raised by an older cousin in the Persian capital of Shushan.","She was taken to the palace with many young women, won everyone's favor, and kept her people's background secret.","The Persian king made her queen in place of Vashti, who had refused to come to him.","She fasted three days, then went to the king unsummoned, and he held out his golden scepter.","She held two banquets for the king and Haman, then exposed Haman's plan to wipe out her people."]},{"id":"mary","level":1,"name":"Mary, mother of Jesus","clues":["A young woman from a small Galilean town, engaged to a carpenter, was visited by an angel with an unexpected assignment.","She was told she would bear a son who would rule as king forever, and she asked how that could be.","She visited her expectant relative Elizabeth, stayed about three months, and praised Jehovah in a long, heartfelt speech.","She gave birth in Bethlehem, laid her baby in a feeding trough, and treasured the shepherds' words in her heart.","She was the wife of the carpenter Joseph and the mother of Jesus, who called herself Jehovah's slave girl."]},{"id":"peter","level":1,"name":"Peter","clues":["A fisherman from Capernaum, who shared his home with his wife, mother-in-law and brother, worked in partnership with the sons of Zebedee.","After a fruitless night, he lowered his nets at Jesus' word and caught so many fish that the boats began to sink.","At Jesus' invitation he stepped out of a boat onto the stormy sea, but began to sink when fear gripped him.","He declared Jesus to be the Christ, the Son of the living God, and received the keys of the kingdom.","This apostle cut off a slave's ear in Gethsemane, denied Jesus three times, and was later told to feed Christ's flock."]},{"id":"naomi","level":2,"name":"Naomi","clues":["A famine in her homeland led her husband to move the family to live as foreigners in Moab.","She was widowed, then lost both her sons, Mahlon and Chilion, who had married Moabite women.","Hearing the famine had ended, she set out for Bethlehem and urged her two sons' widows to return to their mothers' houses.","Back in Bethlehem, women wondered aloud whether it was really her, and she said her name should become \"Bitter.\"","She was Ruth's mother-in-law, guided Ruth toward Boaz, and helped raise Ruth's son as though the boy were hers."]},{"id":"boaz","level":2,"name":"Boaz","clues":["He was an older man of means who owned barley fields in a small Judean town.","He greeted his harvest workers with a blessing in Jehovah's name, which showed he was a man of faith.","He took a fatherly interest in a foreign widow gleaning in his fields, protecting and feeding her and praising her loyalty.","Late one night on the threshing floor, he told a woman that everyone knew she was excellent, and he guarded her reputation.","At the city gate he offered the closer relative the first chance, then bought Elimelech's estate and married Ruth."]},{"id":"hannah","level":2,"name":"Hannah","clues":["A rival wife made the yearly trip to worship at the tabernacle a time of pain for her.","She wept and lost her appetite because she had no children while her rival had many.","She prayed silently at the tabernacle with trembling lips, and the high priest wrongly took her for drunk.","She vowed to dedicate any son to Jehovah's service, and later brought him a sleeveless coat every year.","She was the mother of the prophet Samuel, whom she dedicated to God at Shiloh."]},{"id":"samuel","level":2,"name":"Samuel","clues":["As a small child, barely weaned, he was brought to serve at the tabernacle, far from his home.","His mother brought him a new sleeveless coat every year, and he stayed faithful despite corruption around him.","One night he heard his name called three times and ran to the old priest before learning God was speaking.","As prophet and judge, his prayer brought thunder against the Philistines at Mizpah, yet his own sons took bribes.","He was the son of Hannah, a prophet who anointed both Saul and David as kings."]},{"id":"david","level":2,"name":"David","clues":["The prophet had anointed him as God's choice for a future king, yet he was living rough in the wilderness.","He led hundreds of loyal warriors who guarded a wealthy man's shepherds and flocks as if they were a wall.","He sent ten polite messengers to ask for help, but was insulted and set out furiously with 400 men.","A wise woman met him on his way, and he thanked God for her good sense in keeping him from bloodguilt.","Hunted by King Saul, he later married Abigail and once rescued her from kidnappers."]},{"id":"abigail","level":2,"name":"Abigail","clues":["The Bible praised her good discretion and beauty, yet she was married to a wealthy bully and drunkard.","When a young worker warned her of danger, she hurried to prepare bread, wine, sheep, and cakes of raisins and figs.","Without telling her husband, she met an angry commander and his men, got off her donkey, and humbled herself.","Her wise plea stopped bloodshed, and her husband died about ten days after she told him the story.","She later became David's wife, after her foolish husband Nabal died."]},{"id":"mordecai","level":2,"name":"Mordecai","clues":["A Jewish man who seemingly held a post at Shushan’s castle and was regularly found sitting by its gate.","Though much older, he took in an orphaned relative and raised her as his own daughter.","He exposed a conspiracy against the king’s life, and the warning reached the monarch through the queen.","He refused to bow to Haman, and mourned in sackcloth and ashes when his people were sentenced to death.","Queen Esther's cousin was paraded through Shushan on the king's horse and received Haman's position as prime minister."]},{"id":"joseph","level":2,"name":"Joseph, husband of Mary","clues":["A righteous man who worked with wood was deeply troubled when he learned that his fiancée was expecting a child.","He planned to end the engagement quietly to spare her public shame, until an angel spoke to him in a dream.","After a dream warned that King Herod wanted the young child dead, he took his family to Egypt by night.","He taught his adopted son a trade and regularly took the family to Jerusalem to worship.","He was the carpenter of Nazareth, the husband of Mary, and the adoptive father of Jesus."]},{"id":"martha","level":2,"name":"Martha","clues":["A hardworking woman who lived in a hillside town shared a home with her brother and her sister.","When an honored guest came, she planned an elaborate meal and complained that her sister was not helping.","The guest lovingly said she was anxious about many things, and she accepted the correction without holding a grudge.","When her brother died, she hurried out to meet Jesus and said she knew he would rise in the resurrection.","She was the sister of Mary and Lazarus, and she declared that Jesus is the Christ, the Son of God."]},{"id":"lazarus","level":2,"name":"Lazarus","clues":["He shared a home in Bethany with two sisters, and Jesus counted the household among his dear friends.","When he became seriously ill, his sisters sent word to Jesus, who was about two days' journey away.","He died while his sisters waited for Jesus, and was laid in a cave tomb with a stone across the entrance.","Deeply moved, Jesus had the stone rolled away and called the dead man out; he emerged still wrapped in bandages.","He was the brother of Martha and Mary, raised from the dead by Jesus four days after he died."]},{"id":"cain","level":3,"name":"Cain","clues":["He was the first child born to the first human couple after they were driven out of the garden.","His mother credited Jehovah's help at his birth, and his name means \"Something Produced.\"","He became a farmer and offered produce from his land, but God did not look on it with favor.","God patiently warned him that his anger was leading to serious sin, yet he ignored the warning.","He killed his younger brother Abel in a field, and God condemned him to be a wanderer and fugitive."]},{"id":"elkanah","level":3,"name":"Elkanah","clues":["He was a husband with two wives who took his whole family to worship at Shiloh each year.","He gave his beloved wife a special portion of the sacrifices, and each of his other wife's children received one too.","When his beloved wife wept and would not eat, he asked whether he was not better to her than ten sons.","He did not cancel his wife's vow, though the Law allowed it, but worshipped Jehovah with her at the tabernacle.","He was the father of Samuel, whom he and his wife Hannah presented to the priest Eli."]},{"id":"peninnah","level":3,"name":"Peninnah","clues":["She was one of two wives in a household, and her husband loved the other one more.","She had many sons and daughters, and she grew more self-important with every child.","She deliberately taunted her rival about having no children, especially during the yearly trip to Shiloh.","Her spite made her rival weep and refuse to eat, until it no longer had any effect on her.","She was Elkanah's jealous wife who tormented Hannah over her childlessness, and the Bible never mentions her again."]},{"id":"eli","level":3,"name":"Eli","clues":["He was a high priest at Shiloh, where his own sons treated the sacrifices with disrespect.","Aged and almost blind, he gave his wicked sons only a weak scolding.","He wrongly accused a weeping woman of drunkenness, but then sent her away in peace.","One night a boy ran to him three times, and he realized that Jehovah was calling the child.","He died aged 98, falling from his seat on hearing that the Ark was captured and his two sons were dead."]},{"id":"saul","level":3,"name":"Saul","clues":["He was tall and impressive to look at, and at first he was modest and unassuming.","He became king when the people demanded a human ruler instead of a prophet judging them.","Growing impatient, he offered a sacrifice the prophet was meant to offer, and learned the kingship would leave his family.","He spared the Amalekite king Agag and the best of the spoil, then tried to blame the people.","He lost the kingship and sank into murderous jealousy of David, the man Jehovah chose to replace him."]},{"id":"nabal","level":3,"name":"Nabal","clues":["He owned 3,000 sheep, living in Maon but working land in nearby Carmel.","Though rich, he was a bully and drunkard whom people widely feared and disliked.","At sheepshearing he screamed at ten polite messengers and ridiculed their master as no better than a runaway servant.","His wife saved him; after she told him, he became like a stone and died about ten days later.","He was Abigail's foolish husband, and his insult to David nearly got every male in his household killed."]},{"id":"ahab","level":3,"name":"Ahab","clues":["He ruled the ten-tribe northern kingdom and gave Jehovah more cause for anger than the kings before him.","He raised an altar and temple for Baal and personally led the way in worshipping that false god.","He took the daughter of Sidon’s king as his wife and soon came under her sway.","After rain ended the drought, he rode to Jezreel and told his wife what the prophet had done, never crediting Jehovah.","He was Jezebel's husband, the king whom Elijah outran on the road to Jezreel after the Carmel contest."]},{"id":"jezebel","level":3,"name":"Jezebel","clues":["A princess from Sidon who married a king of Israel and became its queen.","She set out to make Baal worship spread across Israel and to stamp out the worship of Jehovah.","She had many of Jehovah’s faithful servants put to death.","When her husband reported what a prophet had done on Carmel, she flew into a rage.","As Ahab’s wife, she sent word vowing to have Elijah killed by the next day, so he fled."]},{"id":"haman","level":3,"name":"Haman","clues":["A man who climbed to a high place at the Persian court, evidently descended from an Amalekite king named Agag.","The king made him prime minister, second in command, and decreed that everyone must bow down to him.","One Jewish official would not bow, which filled him with rage and made him want to wipe out that man's whole people.","He offered the king a large sum of money and received the royal signet ring to seal an order against the Jews.","After Queen Esther exposed him, he was hanged on the tall stake he had prepared for Mordecai."]},{"id":"gabriel","level":3,"name":"Gabriel","clues":["A heavenly messenger was sent to a town in Galilee to bring an assignment from God to a young woman.","He greeted her as highly favored and told her that Jehovah was with her.","He said she would have a son who would receive David's throne and rule as king forever.","He explained how a virgin could conceive, and strengthened her faith by pointing to an elderly relative's miraculous pregnancy.","He is the angel who told the virgin Mary that she would give birth to the Son of God."]}],"af":[{"id":"abel","level":1,"name":"Abel","clues":["Hy is gebore in die vroegste jare van die mensegeskiedenis, in 'n gesin wat sy Paradystuiste verloor het.","Hy het 'n herder geword, terwyl sy ouer broer die grond bewerk het.","Hy het die beste van sy kudde vir Jehovah gekies om te offer, en God het hom gunstig aangesien.","Sy eie broer het verbitter geraak oor God se goedkeuring, hom veld toe genooi en vermoor.","Hy was Adam en Eva se tweede seun en is deur sy broer Kain vermoor."]},{"id":"noah","level":1,"name":"Noag","clues":["Hy het grootgeword in 'n gewelddadige tyd toe opstandige engele en hulle reuse-seuns die aarde baie erger gemaak het.","Hy het as prediker van regverdigheid opgetree, maar Jesus het gesê die mense van sy tyd het dit nie raakgesien nie.","Met sy gesin se hulp het hy dekades lank 'n reusagtige kis van harsagtige hout gebou en met teer bedek.","God het hom gesê om sy huisgesin en elke soort dier aan boord te bring, waarna Jehovah self die deur toegemaak het.","Hy het die ark gebou en saam met sy gesin die wêreldwye Vloed oorleef."]},{"id":"abraham","level":1,"name":"Abraham","clues":["Hy het tot die tiende geslag ná die Vloed behoort, in 'n ryk stad met 'n hoë tempeltoring vir 'n maangod.","Sy vader was by afgodediens betrokke, maar hy het dit verwerp en die arkbouer se wandel met God probeer navolg.","God het hom gesê om sy land en familie te verlaat, en hy het sy vrou en broerskind saamgeneem.","God het belowe dat hy 'n groot nasie sou word, en hy het die Eufraat oorgesteek en altare vir Jehovah gebou.","Sy nuwe naam het die betekenis \"Vader van 'n menigte\" gehad, en Paulus noem hom voorvader van elkeen wat geloof toon."]},{"id":"sarah","level":1,"name":"Sara","clues":["Sy was merkwaardig mooi, maar nog meer opvallend weens haar sterk geloof in Jehovah.","Sy en haar man het self geen kinders gehad nie, maar hulle het 'n ouerlose broerskind aangeneem.","Sy het in 'n ryk stad vol valse aanbidding gewoon, maar sy en haar man was bereid om anders te wees.","Hoewel nie meer jonk nie, het sy haar gemaklike huis verlaat en saam met haar man na 'n onbekende land getrek.","God het haar later 'n nuwe naam gegee wat \"Prinses\" beteken; haar man word onthou as voorvader van elkeen met geloof."]},{"id":"ruth","level":1,"name":"Rut","clues":["Sy het grootgeword in 'n klein land aan die oostekant van die Dooie See, waar mense baie gode aanbid het.","Sy het 'n weduwee geword voordat sy kinders gehad het, en so ook haar skoonsuster Orpa.","Anders as Orpa wou sy nie terugkeer na haar volk en gode nie, maar het saam met haar skoonmoeder na Betlehem gereis.","Met die garsoes het sy oes opgetel op die land van 'n ryk familielid van haar oorlede man, wat haar raakgesien het.","Hierdie Moabitiese vrou het met Boas getrou en 'n voorouer van koning Dawid en van Jesus geword."]},{"id":"elijah","level":1,"name":"Elia","clues":["’n Profeet van Israel se tienstammeryk wat ’n droogte aan ’n goddelose koning moes aankondig.","Hy het Israeliete gevra hoe lank hulle nog tussen twee opinies kreupel sou loop: Jehovah of Baäl.","Van ’n berg af het hy sy bediende sewe keer gestuur om see toe te kyk, totdat ’n wolkie opgekom het.","Bang vir ’n koningin het hy gevlug, onder ’n besemstruik om die dood gevra, en ’n engel het hom kos gegee.","Op die berg Karmel het vuur uit die hemel sy offer verteer; later moes hy Elisa as opvolger salf."]},{"id":"jonah","level":1,"name":"Jona","clues":["’n Profeet van Gat-Hefer, naby die dorp waar Jesus later sou grootword, in die tyd van Jerobeam II.","Beveel om oostewaarts te gaan, het hy weswaarts na Joppe gegaan en aan boord van ’n skip na Tarsis geklim.","’n Storm het die skip getref, die lot het op hom geval, en hy het gevra om oorboord gegooi te word.","Drie dae en drie nagte was hy in ’n groot vis wat Jehovah beskik het, voordat hy op droë grond uitgebraak is.","Hy het Nineve gewaarsku, was kwaad toe die stad gespaar is, en het deur ’n kalbasplant ’n les in barmhartigheid geleer."]},{"id":"esther","level":1,"name":"Ester","clues":["’n Joodse weeskind wat deur ’n ouer neef grootgemaak is in die Persiese hoofstad Susan.","Sy is saam met baie jong vroue na die paleis geneem, het almal se guns verwerf en haar herkoms geheim gehou.","Die Persiese koning het haar koningin gemaak in die plek van Vasti, wat geweier het om te kom.","Sy het drie dae gevas en sonder ontbieding by die koning ingegaan, en hy het sy goue septer na haar uitgehou.","Sy het twee gastemale vir die koning en Haman gereël en toe Haman se plan om haar volk uit te wis ontbloot."]},{"id":"mary","level":1,"name":"Maria, die moeder van Jesus","clues":["'n Jong vrou uit 'n klein dorpie in Galilea, verloof aan 'n timmerman, het besoek van 'n engel met 'n onverwagte opdrag gekry.","Haar is gesê sy sal 'n seun dra wat vir ewig as koning sal regeer, en sy het gevra hoe.","Sy het haar swanger familielid Elisabet besoek, ongeveer drie maande by haar gebly en Jehovah in 'n lang toespraak geprys.","Sy het in Betlehem geboorte gegee, haar baba in 'n krip gelê en die herders se woorde in haar hart bewaar.","Sy was die vrou van die timmerman Josef en die moeder van Jesus, en het haarself Jehovah se slavin genoem."]},{"id":"peter","level":1,"name":"Petrus","clues":["'n Visser van Kapernaum, wat saam met sy vrou, skoonma en broer gewoon het, het in vennootskap met Sebedeus se seuns gewerk.","Ná 'n vrugtelose nag het hy op Jesus se woord sy nette gegooi en soveel vis gevang dat die bote begin sink het.","Op Jesus se uitnodiging het hy uit 'n boot op die stormagtige see geklim, maar begin sink toe vrees hom beetkry.","Hy het Jesus as die Christus, die Seun van die lewende God, erken en die sleutels van die koninkryk ontvang.","Hierdie apostel het in Getsemane 'n slaaf se oor afgekap, Jesus drie keer verloën en moes later Christus se kudde voed."]},{"id":"naomi","level":2,"name":"Naomi","clues":["'n Hongersnood in haar geboorteland het haar man laat besluit om die gesin as uitlanders in Moab te laat woon.","Sy het 'n weduwee geword en toe albei seuns, Maglon en Giljon, verloor; hulle het Moabitiese meisies as vroue gehad.","Toe sy hoor die hongersnood is verby, het sy na Betlehem vertrek en haar skoondogters aangespoor om terug te keer.","Terug in Betlehem het vroue gewonder of dit werklik sy was, en sy het gesê haar naam moet \"Bitter\" word.","Sy was Rut se skoonmoeder, het haar na Boas gelei en Rut se seun help versorg soos haar eie."]},{"id":"boaz","level":2,"name":"Boas","clues":["Hy was 'n ouer, welgestelde man wat garslande in 'n klein dorp in Juda besit het.","Hy het sy oeswerkers met 'n seën in Jehovah se naam gegroet, wat getoon het dat hy 'n man van geloof was.","Hy het vaderlike belangstelling getoon in 'n uitlandse weduwee wat in sy landerye oes opgetel het, en haar beskerm en gevoed.","Laat een aand op die dorsvloer het hy vir 'n vrou gesê almal ken haar as voortreflik, en beskerm haar naam.","By die stadspoort het hy eers die nader familielid die kans gegee, en toe Elimeleg se bate gekoop en met Rut getrou."]},{"id":"hannah","level":2,"name":"Hanna","clues":["’n Mededingende vrou het die jaarlikse reis na die tabernakel vir haar ’n tyd van pyn gemaak.","Sy het gehuil en haar eetlus verloor omdat sy geen kinders gehad het nie, terwyl haar mededingster baie gehad het.","Sy het stil by die tabernakel gebid met bewende lippe, en die hoëpriester het haar verkeerdelik vir dronk gehou.","Sy het belowe om enige seun aan Jehovah se diens te wy, en het hom later elke jaar ’n moulose oorkleed gebring.","Sy was die moeder van die profeet Samuel, wat sy in Silo aan God opgedra het."]},{"id":"samuel","level":2,"name":"Samuel","clues":["As klein kindjie, skaars gespeen, is hy gebring om by die tabernakel te dien, ver van sy tuiste af.","Sy ma het hom elke jaar ’n nuwe oorkleed gebring, en hy het getrou gebly ondanks die korrupsie rondom hom.","Een nag het hy sy naam drie keer hoor roep en na die ou priester gehardloop, voordat hy besef het God praat.","As profeet en regter het sy gebed donderweer teen die Filistyne by Mispa gebring, maar sy seuns het omkoopgeskenke aanvaar.","Hy was die seun van Hanna, ’n profeet wat sowel Saul as Dawid as konings gesalf het."]},{"id":"david","level":2,"name":"Dawid","clues":["Die profeet het hom as God se keuse vir ’n toekomstige koning gesalf, tog het hy ruw in die wildernis gelewe.","Hy het honderde getroue krygsmanne gelei wat ’n ryk man se herders en kuddes bewaak het asof hulle ’n muur was.","Hy het tien beleefde boodskappers gestuur om hulp te vra, maar is beledig en het woedend met 400 man uitgetrek.","’n Verstandige vrou het hom op sy pad ontmoet, en hy het God geloof dat haar verstandigheid hom van bloedskuld weerhou het.","Deur koning Saul gejag, het hy later met Abigail getrou en haar eenmaal van ontvoerders gered."]},{"id":"abigail","level":2,"name":"Abigail","clues":["Die Bybel het haar goeie oordeel en skoonheid geprys, tog was sy getroud met ’n ryk bullebak en dronkaard.","Nadat ’n jong werker haar gewaarsku het, het sy gehaas om brood, wyn, skape en rosyn- en vyekoeke gereed te maak.","Sonder om haar man te vertel, het sy ’n kwaai bevelvoerder en sy manne ontmoet, afgeklim van haar donkie en haarself verneder.","Haar verstandige pleidooi het bloedvergieting gestuit, en haar man is omtrent tien dae nadat sy hom vertel het, dood.","Sy het later Dawid se vrou geword, nadat haar dwase man Nabal gesterf het."]},{"id":"mordecai","level":2,"name":"Mordegai","clues":["’n Joodse man wat klaarblyklik ’n pos by Susan se kasteel gehad het en gereeld by die poort te vinde was.","Al was hy baie ouer, het hy ’n weeskind van sy familie ingeneem en as sy eie dogter grootgemaak.","Hy het ’n sameswering teen die koning se lewe blootgelê, en die waarskuwing het die koning deur die koningin bereik.","Hy het geweier om voor Haman te buig, en het in sak en as getreur toe sy volk ter dood veroordeel is.","Ester se neef is op die koning se perd deur Susan rondgelei en het Haman se amp as eerste minister gekry."]},{"id":"joseph","level":2,"name":"Josef, die man van Maria","clues":["'n Regverdige man wat met hout gewerk het, was diep ontsteld toe hy hoor dat sy verloofde 'n kind verwag.","Hy het beplan om haar stilletjies te skei om skande te spaar, totdat 'n engel in 'n droom met hom gepraat het.","Nadat 'n droom gewaarsku het dat koning Herodes die kind wou doodmaak, het hy sy gesin snags na Egipte geneem.","Hy het sy aangenome seun 'n ambag geleer en die gesin gereeld na Jerusalem geneem om te aanbid.","Hy was die timmerman van Nasaret, die man van Maria en die aangenome vader van Jesus."]},{"id":"martha","level":2,"name":"Marta","clues":["'n Hardwerkende vrou in 'n dorpie teen 'n heuwel het saam met haar broer en haar suster gewoon.","Toe 'n eregas kom, het sy 'n uitgebreide maaltyd beplan en gekla dat haar suster nie help nie.","Die gas het liefdevol gesê sy is bekommerd oor baie dinge, en sy het die teregwysing sonder wrok aanvaar.","Toe haar broer gesterf het, het sy Jesus haastig tegemoetgegaan en gesê sy weet hy sal in die opstanding opstaan.","Sy was die suster van Maria en Lasarus, en het verklaar dat Jesus die Christus, die Seun van God, is."]},{"id":"lazarus","level":2,"name":"Lasarus","clues":["Hy het in Betanië saam met twee susters gewoon, en Jesus het die gesin as sy dierbare vriende beskou.","Toe hy ernstig siek geword het, het sy susters boodskap aan Jesus gestuur, wat ongeveer twee dae se reis ver was.","Hy het gesterf terwyl sy susters op Jesus gewag het, en is in 'n grafspelonk met 'n klip voor die ingang gelê.","Jesus het, diep ontroer, die klip laat wegrol en die dooie man uitgeroep; hy het uitgekom, nog in verbande toegedraai.","Hy was die broer van Marta en Maria, wat Jesus vier dae ná sy dood uit die dood opgewek het."]},{"id":"cain","level":3,"name":"Kain","clues":["Hy was die eerste kind van die eerste mensepaar, gebore nadat hulle uit die tuin van Eden uitgesit is.","Sy ma het Jehovah se hulp by sy geboorte erken, en sy naam beteken \"Iets wat voortgebring is\".","Hy het 'n landbouer geword en opbrengs van sy grond geoffer, maar God het dit nie gunstig aangesien nie.","God het hom geduldig gewaarsku dat sy woede tot ernstige sonde lei, maar hy het die waarskuwing geïgnoreer.","Hy het sy jonger broer Abel in 'n veld doodgemaak, en God het hom veroordeel om 'n swerwer en vlugteling te wees."]},{"id":"elkanah","level":3,"name":"Elkana","clues":["Hy was ’n man met twee vroue wat elke jaar sy hele gesin Silo toe geneem het om te aanbid.","Hy het sy geliefde vrou ’n spesiale deel van die offerandes gegee, maar die ander vrou se kinders ook elkeen ’n deel.","Toe sy huil en nie wou eet nie, het hy gevra of hy nie vir haar beter as tien seuns is nie.","Hy het sy vrou se gelofte nie nietig verklaar nie, hoewel die Wet dit toegelaat het, maar het saam met haar aanbid.","Hy was die vader van Samuel, wat hy en sy vrou Hanna vir die priester Eli aangebied het."]},{"id":"peninnah","level":3,"name":"Peninna","clues":["Sy was een van twee vroue in ’n huishouding, en haar man het die ander een liewer gehad.","Sy het baie seuns en dogters gehad, en met elke kind het sy meer verwaand geraak.","Sy het haar mededingster opsetlik oor haar kinderloosheid getart, veral tydens die jaarlikse reis na Silo.","Haar venyn het haar mededingster laat huil en nie laat eet nie, totdat dit uiteindelik geen uitwerking meer gehad het nie.","Sy was Elkana se jaloerse vrou wat Hanna oor haar kinderloosheid gekwel het, en die Bybel noem haar nooit weer nie."]},{"id":"eli","level":3,"name":"Eli","clues":["Hy was ’n hoëpriester in Silo, waar sy eie seuns die offerandes met minagting behandel het.","Hy was bejaard en amper blind, en het sy goddelose seuns net swak berispe.","Hy het ’n huilende vrou verkeerdelik van dronkenskap beskuldig, maar haar toe in vrede laat gaan.","Een nag het ’n seun drie keer na hom gehardloop, en hy het besef dat Jehovah die kind roep.","Op 98 het hy van sy stoel geval en gesterf toe hy hoor die Ark is buit en sy seuns dood."]},{"id":"saul","level":3,"name":"Saul","clues":["Hy was lank en indrukwekkend om na te kyk, en aanvanklik beskeie en nederig.","Hy het koning geword toe die volk ’n menslike heerser geëis het in plaas van ’n profeet as regter.","Uit ongeduld het hy ’n offerande gebring wat die profeet moes bring, en geleer die koningskap sou sy familie verlaat.","Hy het Agag, die Amalekiete se koning, en die beste buit gespaar en toe die volk blameer.","Hy het die koningskap verloor en in moordlustige jaloesie teenoor Dawid versink, die man wat Jehovah in sy plek gekies het."]},{"id":"nabal","level":3,"name":"Nabal","clues":["Hy het 3 000 skape besit en in Maon gewoon, maar grond in die nabygeleë Karmel bewerk.","Hoewel hy ryk was, was hy ’n bullebak en dronkaard wat deur baie mense gevrees en gehaat is.","Terwyl sy skape geskeer is, het hy op tien beleefde boodskappers geskree en hul meester as ’n wegloperkneg bespot.","Sy vrou het hom gered; ná haar vertelling het hy soos ’n klip geword en omtrent tien dae later gesterf.","Hy was Abigail se dwase man, en sy belediging van Dawid het amper elke man in sy huishouding laat doodmaak."]},{"id":"ahab","level":3,"name":"Agab","clues":["Hy het oor Israel se tienstammeryk regeer en Jehovah meer rede tot woede gegee as die konings voor hom.","Hy het ’n altaar en tempel vir Baäl opgerig en self die voorbeeld gestel in die aanbidding van daardie valse god.","Hy het die dogter van Sidon se koning as vrou geneem en gou onder haar ban beland.","Nadat reën die droogte beëindig het, het hy na Jisreël gery en sy vrou vertel wat die profeet gedoen het, sonder Jehovah.","Hy was Isebel se man, die koning wie Elia ná die wedstryd op Karmel tot by Jisreël voorgehardloop het."]},{"id":"jezebel","level":3,"name":"Isebel","clues":["’n Prinses uit Sidon wat met ’n koning van Israel getrou het en koningin geword het.","Sy wou Baälaanbidding oor Israel laat versprei en Jehovah se aanbidding heeltemal laat verdwyn.","Sy het baie van Jehovah se getroue knegte laat doodmaak.","Toe haar man vertel wat ’n profeet op Karmel gedoen het, het sy briesend geword.","As Agab se vrou het sy vir Elia laat weet dat sy hom teen môre sou laat doodmaak, en hy het gevlug."]},{"id":"haman","level":3,"name":"Haman","clues":["’n Man wat in die Persiese hof hoog opgeklim het en blykbaar van die Amalekitiese koning Agag afgestam het.","Die koning het hom eerste minister gemaak, tweede in bevel, en beveel dat almal voor hom moet buig.","’n Joodse amptenaar wou nie buig nie, en dit het hom so kwaad gemaak dat hy sy hele volk wou uitroei.","Hy het die koning geld aangebied en sy seëlring gekry om ’n bevel te seël wat die Jode sou uitwis.","Nadat Koningin Ester hom ontbloot het, is hy gehang aan die groot paal wat hy vir Mordegai laat maak het."]},{"id":"gabriel","level":3,"name":"Gabriël","clues":["'n Hemelse boodskapper is na 'n dorp in Galilea gestuur om 'n opdrag van God aan 'n jong vrou te bring.","Hy het haar as hoogbegunstigde gegroet en vir haar gesê dat Jehovah met haar is.","Hy het gesê sy sal 'n seun hê wat Dawid se troon sal ontvang en vir ewig as koning sal regeer.","Hy het verduidelik hoe 'n maagd kan swanger word, en het na 'n bejaarde familielid se wonderbaarlike swangerskap verwys.","Hy is die engel wat vir die maagd Maria gesê het dat sy die Seun van God sal baar."]}]};
var PLACEDATA={"en":[{"id":"jerusalem","level":1,"name":"Jerusalem","clues":["Set high among the hills at the edge of a dry wilderness, this city could only be reached by going up.","Steep valleys, such as the Kidron and Hinnom, guarded it on most sides, leaving only the north without natural defense.","It became Israel's capital in David's time and stayed the capital of the southern kingdom of Judah after the nation divided.","Solomon built Jehovah's temple here, and the Bible calls this city the holy city and the city of Jehovah.","Jesus taught in its temple, and Roman armies under Titus later destroyed this city, just as he had foretold."]},{"id":"bethlehem","level":1,"name":"Bethlehem","clues":["This rocky highland town in Judah, a short way south of the capital, produced olives, grapes and grain.","Rachel was buried along the road leading to it, and Naomi came back here with her Moabite daughter-in-law Ruth.","Boaz lived here, and David once longed for water from its cistern while a Philistine outpost held the town.","A young shepherd named David, son of Jesse, was born here and anointed by Samuel as Israel's future king.","The prophet Micah foretold that the Messiah would come from this little town, and Jesus was born here."]},{"id":"nazareth","level":1,"name":"Nazareth","clues":["This Galilean city lay in a mountain basin ringed by hills, a little north of the Valley of Jezreel.","Nathanael doubted that anything good could come out of this place when he first heard about the man from there.","After returning from Egypt with the young child, Joseph and Mary settled in this city again.","Angry townspeople, after hearing Jesus read from Isaiah in their synagogue, tried to hurl him off the brow of their mountain.","Jesus grew up in this Galilean city with his half brothers and half sisters, long before his baptism by John."]},{"id":"egypt","level":1,"name":"Egypt","clues":["A long, narrow green ribbon of farmland squeezed between desert cliffs, this land lived or died by an annual flood.","Its fields gave barley, wheat and flax for fine linen, and Israelites in the wilderness longed for its cucumbers, leeks and garlic.","When famine struck, Jacob's family came down here for food, where Joseph had risen to a high position under the ruler.","God's people grew into a mighty nation here, but later suffered under a Pharaoh who forced them into slavery.","After ten plagues struck this land of the Nile and the Pharaohs, Moses led the Israelites out of it."]},{"id":"babylon","level":1,"name":"Babylon","clues":["This great city stood astride the Euphrates on the plains of Shinar, protected by double walls and a moat.","A busy hub of world trade, it was packed with temples and idols, and its people trusted in astrology and magic.","Its king boasted that he had built it in all its glory, and he hauled valuable vessels from Jehovah's temple to it.","Here Daniel explained the mysterious writing on the palace wall at a feast, the very night Medes and Persians took the city.","Thousands of Jews were carried off to this city as captives, and the apostle Peter later wrote his first letter from here."]},{"id":"sinai","level":1,"name":"Mount Sinai","clues":["A mountain in Arabia, near which a vast company with countless flocks and herds camped for almost a year.","At its foot lay room for a huge crowd to gather, and a torrent came streaming down from its heights.","Moses first met Jehovah's angel near here, in a thornbush that burned yet was not consumed.","Thunder, lightning, a heavy cloud and a loud horn blast came as the whole mountain rocked and smoked.","Moses went up here to receive the Ten Commandments, and Israel entered the Law covenant at its foot."]},{"id":"jordan","level":1,"name":"Jordan River","clues":["The chief river of the Promised Land, it marked a natural boundary between east and west and flooded when Hermon's snow melted.","It twists through a jungle of thickets where lions once roamed, running from the Sea of Galilee down to the Dead Sea.","A leprous army commander was healed after obeying the prophet's word to wash in its waters seven times.","Israel crossed on dry land when God dammed its flood-swollen waters, and Elijah and Elisha later parted it as well.","John the Baptizer immersed repentant Jews in this river, and Jesus came to him here to be baptized."]},{"id":"eden","level":1,"name":"Garden of Eden","clues":["Its name means pleasure, and it designated a region lying toward the east.","God planted a park-like place there, and a river issuing from the region watered its soil.","Its trees gave both beauty and a wide variety of food, and a man was assigned to cultivate and care for it.","That man named every animal and bird God brought before him in this beautiful home.","The first human couple lost this original home after a serpent tempted them to eat from the forbidden tree."]},{"id":"redsea","level":1,"name":"Red Sea","clues":["This long, salty sea lies between the northeast corner of Africa and Arabia, and its reefs and winds trouble sailors.","Its northeastern arm touched the southern edge of Edom, and Israel's own boundary was set to reach it too.","A Pharaoh chased fleeing slaves to its shore with his chariots and soldiers, with the sea ahead and the army behind.","Jehovah divided its waters so that the Israelites could walk through on dry land.","Its waters came rushing back and drowned Pharaoh's army, right after Moses led Israel across this sea."]},{"id":"ararat","level":1,"name":"Mount Ararat","clues":["This mountainous land lay north of Assyria, in ancient Armenia near the headwaters of the Tigris River.","After murdering their father the king, two sons of Sennacherib fled to this land.","Jeremiah named its kingdom among those that would be called up against Babylon in the sixth century B.C.E.","Its loftiest peak is a huge snow-capped cone, and local place names in the area recall a famous patriarch.","Noah's ark came to rest on the mountains here after the Flood."]},{"id":"galilee","level":1,"name":"Sea of Galilee","clues":["A freshwater lake in the north, lying far below sea level and fed mainly by the Jordan River.","Sudden storms struck it because gusts swept down the Jordan Valley from a snow-topped mountain in the north.","In the first century, nine cities were said to stand on its shores, but today only one remains.","Jesus taught crowds from a boat here and called the fishermen Peter, Andrew, James and John.","Beside this northern lake Jesus calmed the wind and waves, walked on the water, and fed thousands with few loaves."]},{"id":"jericho","level":1,"name":"Jericho","clues":["Deep in the Jordan Valley, far below sea level, this warm city was known for its palm trees.","After crossing the Jordan, Israel's army took this Canaanite city before any other.","Two spies were hidden here by a woman named Rahab, whose house stood on the city wall.","Jesus stayed at the home of Zacchaeus in this city and healed a blind man named Bartimaeus nearby.","The Israelites marched around it once a day for six days, then seven times on the seventh, and its walls fell flat."]},{"id":"capernaum","level":2,"name":"Capernaum","clues":["A lakeside city in Galilee, important enough to have a tax office and perhaps a military post.","Springs flowing into the lake nearby drew many fish, making the shore an excellent place for fishermen.","An army officer there, who had built a synagogue for the Jews, asked Jesus to heal his sick slave.","Jesus healed Peter's mother-in-law here, and a paralyzed man was lowered through the roof to reach him.","After leaving Nazareth, Jesus made this city his base in Galilee, and here he called the tax collector Matthew."]},{"id":"damascus","level":2,"name":"Damascus","clues":["An ancient Syrian city on a high plain at the foot of a mountain range, watered by a rushing river.","Its fertile oasis made it a crossroads for caravans and armies between Mesopotamia, Egypt and Arabia.","Abraham's servant Eliezer was a man of this city, and the Syrian kings Ben-hadad and Hazael ruled from it.","King Ahaz of Judah saw an altar here and had a copy made for false worship.","Saul was heading here to persecute Christians when he was blinded, and he later stayed on the street called Straight."]},{"id":"nineveh","level":2,"name":"Nineveh","clues":["An ancient city founded by Nimrod, standing on the eastern bank of the Tigris River.","It became the capital of a mighty empire famed for brutal warfare, and a goddess of love and war was worshiped there.","King Sennacherib of Assyria was murdered here, in the house of his god Nisroch.","The prophets Nahum and Zephaniah foretold its downfall, and Babylon and Media later turned it into a ruin heap.","Jonah was sent to warn this great city, and its people, even the king, repented, so God spared it."]},{"id":"carmel","level":2,"name":"Mount Carmel","clues":["A forested mountain range jutting into the Mediterranean, carpeted with flowers in spring, its headland dividing the coastal plain.","Its steep, wooded slopes blocked the way, so caravans and armies heading between Mesopotamia and Egypt had to find another route.","Refugees from the northern kingdom hid in its caves and forests, yet the prophet Amos said they could not escape God there.","From its summit Elijah prayed for the long drought to end, and his attendant spotted a small cloud.","Here Elijah challenged the 450 prophets of Baal before King Ahab to show who the true God was."]},{"id":"samaria","level":2,"name":"Samaria","clues":["A flat-topped hill in the highlands north of Jerusalem, easy to defend, with a distant view toward the sea.","King Omri bought the hill from a man named Shemer and began building a city there.","It became the capital of the ten-tribe kingdom and a rival of Jerusalem, with a Baal temple and a house of ivory.","The leper Naaman came here seeking a cure, and a Syrian siege later caused a terrible famine.","The Assyrians finally conquered this capital after a siege and exiled its leading people, ending the northern kingdom."]},{"id":"bethany","level":2,"name":"Bethany","clues":["A modest village on the eastern slope of a famous ridge, along an ancient approach road from the Jordan Valley.","It lay about two miles from the capital, on the road that came up from Jericho.","During his last days Jesus spent his nights here, doubtless in the home of Martha, Mary and Lazarus.","At a meal in the home of Simon the leper, Mary poured costly oil on Jesus, and Judas objected.","Here Jesus raised Lazarus from the dead, and from near this village he later ascended to heaven."]},{"id":"tyre","level":2,"name":"Tyre","clues":["An independent Phoenician seaport outside Israel's borders, famous for its sailors and its fleet of trading ships.","Its craftsmen made metalwork, glassware and purple dye, and its great wealth made its merchants proud.","Jesus once visited the region around this city and healed the demon-possessed daughter of a Syrophoenician woman.","Ezekiel pictured it as a splendid ship doomed to sink, and Nebuchadnezzar besieged it for a long time.","Its king Hiram sent cedar and skilled workmen to David and Solomon; Alexander the Great later built a causeway to its island."]},{"id":"olives","level":2,"name":"Mount of Olives","clues":["A long ridge east of Jerusalem with three summits, the middle one facing the temple area across a valley.","Its name came from the trees that once covered it, until a Roman siege stripped it bare.","King David climbed it barefoot and weeping while fleeing from his rebellious son Absalom.","Jesus often met his disciples in a garden on or near it, and rode in triumph over it on a colt.","Here Jesus told his disciples how his presence would be marked, and after his resurrection he went up to heaven from it."]},{"id":"gethsemane","level":2,"name":"Gethsemane","clues":["Probably an olive grove, it would have held equipment for crushing the fruit to obtain oil.","It lay east of a famous city, on the far side of a valley, at or close to a well-known mount.","Jesus frequently gathered here with his disciples.","On the night of the Passover, Jesus withdrew here with his loyal disciples to pray.","Judas Iscariot found and betrayed Jesus here, and an armed crowd then took him into custody."]},{"id":"golgotha","level":2,"name":"Golgotha","clues":["Today a church stands on its traditional site, built after a fourth-century emperor had a pagan temple demolished.","It lay just beyond the walls of a famous city, with a road and a garden tomb close by.","Many imagine a hill, yet the Bible never says so; it only mentions some onlookers watching from afar.","Its name refers to a part of the human head.","Jesus Christ was impaled here."]},{"id":"antioch","level":2,"name":"Antioch (of Syria)","clues":["Founded by a general who named it for his father, this city stood on the bank of a navigable river.","It served as capital of a Roman province and was the empire's third-largest city, behind only Rome and Alexandria.","The Jerusalem congregation sent Barnabas here, and he then fetched Paul from Tarsus to help.","Paul set out on his missionary tours from here, and the congregation sent relief to Jerusalem during a famine.","It was here, under God's direction, that the disciples were first called Christians."]},{"id":"corinth","level":2,"name":"Corinth","clues":["This prominent Greek city lay on a narrow strip of land linking the mainland with the southern peninsula.","Charges on cargo moving across that strip enriched it, and it was also an industrial center known for pottery and bronzeware.","Worship of a goddess, whose temple sat atop a steep rocky hill, made its immorality proverbial.","Paul stayed eighteen months, and Jews who opposed his message brought him before the proconsul Gallio.","Paul addressed two letters to the congregation here, and from here he later wrote to the one in Rome."]},{"id":"ephesus","level":3,"name":"Ephesus","clues":["A wealthy trading and religious center on the western coast of Asia Minor, on the main route from Rome eastward.","Its most outstanding building, a temple with a hundred marble columns, ranked among the seven wonders of the ancient world.","A Jewish couple stayed on here and helped Apollos of Alexandria, who knew only John's baptism.","Paul taught daily for two years in the school auditorium of Tyrannus, and former practitioners of magic publicly burned their scrolls.","Silversmiths started a two-hour riot in the theater here, fearing Paul's preaching would ruin the worship of Artemis."]},{"id":"athens","level":3,"name":"Athens","clues":["Sheltered by mountains and close to a seaport, this Greek city was famed chiefly for scholarship, literature and art.","Four schools of philosophy flourished here, and students from across the empire attended them.","A renowned temple stood on the hill rising above the city where Socrates, Plato and Aristotle lived.","Paul was upset by all the idols here, reasoned in the marketplace, and was approached by Stoic and Epicurean philosophers.","Paul spoke here about an altar 'To an Unknown God', and a judge of the Areopagus became a believer."]},{"id":"philippi","level":3,"name":"Philippi","clues":["A Macedonian city that Alexander the Great's father seized from the Thracians and renamed after himself.","On its plain, Octavian and Mark Antony defeated the assassins of Julius Caesar, and the city afterward became a Roman colony.","Paul first preached in Europe here, after a night vision at Troas of a Macedonian man.","On the Sabbath, Paul spoke to women beside a river here, and Lydia opened her heart and was baptized.","Paul and Silas, beaten and jailed here, praised God until an earthquake opened the doors and the jailer believed."]},{"id":"rome","level":3,"name":"Rome","clues":["Once a small city in Latium, it was built on seven hills beside a river, some distance inland.","It became the capital of the mightiest empire of Bible times, and its rulers received worship as
